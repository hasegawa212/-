<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>役割マップ｜株式会社 Martial Arts</title>
<style>
/* 数字の帯 → 気をつける仕事 → 人ごとのカード → 仕事の一覧（絞り込み）→ 席との対応。白×金、警告は赤・黄 */
:root{
  --bg:#f8f7f3; --surface:#fff; --fg:#1c1a16; --sub:#6a655b; --line:#e4dece;
  --gold:#977425; --gold-soft:#f3ead6; --red:#b3321f; --red-soft:#f8e3dd; --amber:#8a6400; --amber-soft:#f6ebcc;
  --font:"Hiragino Sans","Yu Gothic","Meiryo","IPAGothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141310; --surface:#1d1b17; --fg:#f1eee6; --sub:#a8a193; --line:#332f27;
  --gold:#d6b66a; --gold-soft:#2b2518; --red:#f08b77; --red-soft:#3a1f19; --amber:#e6c25c; --amber-soft:#33290f; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.7}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 56px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--sub)}
h1{font-size:clamp(24px,4vw,36px);margin:4px 0 6px;letter-spacing:.04em}
.lead{color:var(--sub);margin:0;max-width:70ch}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:18px 0 6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .n{font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--sub)}
.stat.red .n{color:var(--red)} .stat.amber .n{color:var(--amber)}
h2{font-size:19px;margin:32px 0 10px;display:flex;gap:10px;align-items:center}
h2::before{content:"";width:6px;height:20px;background:var(--gold);border-radius:2px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.panel h3{margin:0 0 6px;font-size:15px}
.panel.red{border-top:4px solid var(--red)} .panel.amber{border-top:4px solid var(--amber)} .panel.gold{border-top:4px solid var(--gold)}
.task{padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.task:last-child{border-bottom:none}
.task .meta{font-size:12px;color:var(--sub)}
.tag{display:inline-block;font-size:11px;padding:0 7px;border-radius:999px;background:var(--gold-soft);color:var(--gold);margin-left:4px;white-space:nowrap}
.tag.guess{background:var(--amber-soft);color:var(--amber)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
details.person{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
details.person summary{cursor:pointer;list-style:none;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
details.person summary::-webkit-details-marker{display:none}
details.person[open]{border-color:var(--gold)}
.pn{font-weight:800;font-size:16px}
.pt{font-size:12.5px;color:var(--sub);grid-column:1/2}
.lv{grid-row:1/3;grid-column:2;align-self:center;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
.lv.重い{background:var(--red-soft);color:var(--red)} .lv.ふつう{background:var(--gold-soft);color:var(--gold)} .lv.軽い{background:var(--line);color:var(--sub)}
.cnt{grid-column:1/3;font-size:12.5px;color:var(--sub)}
.pbody{padding:0 14px 12px;border-top:1px dashed var(--line)}
.pbody h4{margin:10px 0 2px;font-size:13px;color:var(--gold)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
select,input{font:inherit;font-size:14px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--gold-soft);font-size:12px;color:var(--sub);white-space:nowrap}
td.nw{white-space:nowrap}
tr:last-child td{border-bottom:none}
.none{color:var(--red);font-weight:700}
.foot{margin-top:28px;font-size:12.5px;color:var(--sub)}
@media (max-width:820px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow" id="eyebrow">株式会社 Martial Arts</div>
  <h1>役割マップ｜誰が何をやっているか</h1>
  <p class="lead">Slack で実際にやっている仕事を、人ごとに並べました。担当がいない仕事、控えがいない仕事、代表が自分でやっている仕事を先に出しています。</p>
  <div class="stats" id="stats"></div>

  <h2>気をつける仕事</h2>
  <div class="cols">
    <div class="panel red"><h3>担当なし</h3><div id="gaps"></div></div>
    <div class="panel amber"><h3>代表が自分でやっている</h3><div id="ceo"></div></div>
    <div class="panel gold"><h3>控えがいない（毎日・毎週）</h3><div id="single"></div></div>
  </div>

  <h2>人ごと</h2>
  <div class="people" id="people"></div>

  <h2>仕事の一覧</h2>
  <div class="filters">
    <select id="fArea" aria-label="部門"><option value="">部門：全部</option></select>
    <select id="fFreq" aria-label="頻度"><option value="">頻度：全部</option></select>
    <select id="fPerson" aria-label="人"><option value="">人：全員</option><option value="__none">担当なし</option></select>
    <input id="fText" type="search" placeholder="仕事の名前で探す" aria-label="キーワード">
  </div>
  <div class="tbl"><table>
    <thead><tr><th>仕事</th><th>部門</th><th>頻度</th><th>主</th><th>副・控え</th><th>席</th><th>根拠</th></tr></thead>
    <tbody id="list"></tbody>
  </table></div>

  <h2>立候補の席との対応</h2>
  <div class="tbl"><table>
    <thead><tr><th>席</th><th>関係する仕事</th><th>今やっている人</th></tr></thead>
    <tbody id="seats"></tbody>
  </table></div>

  <p class="foot" id="foot"></p>
</div>
<script src="lib/rolemap.js"></script>
<script src="data/roles.js"></script>
<script>
(function(){
  const D = window.RM_DATA, R = window.RM;
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const name = id => R.nameOf(D, id);
  const ev = t => t.evidence.map(e => esc(e.channel) + " " + esc(e.date.slice(5).replace("-", "/"))).join("、");
  const item = t => '<div class="task">' + esc(t.name) + (t.confidence === "推測" ? '<span class="tag guess">推測</span>' : "") + (t.seat ? '<span class="tag">' + esc(t.seat) + '</span>' : "") +
    '<div class="meta">' + esc(t.freq) + "・" + (t.owner ? esc(name(t.owner)) : "担当なし") + "　" + ev(t) + (t.issue ? "<br>⚠ " + esc(t.issue) : "") + "</div></div>";
  const s = R.summary(D, D.ceoId);
  document.getElementById("eyebrow").textContent = "株式会社 Martial Arts　" + D.asOf + " 時点（Slack " + D.period + "）";
  document.getElementById("stats").innerHTML = [
    ["在籍", s.people, ""], ["仕事", s.tasks, ""], ["担当なし", s.gaps, "red"], ["代表が自分で", s.ceo, "amber"], ["控えなし", s.single, "amber"]
  ].map(([l, n, c]) => '<div class="stat ' + c + '"><div class="n">' + n + '</div><div class="l">' + l + "</div></div>").join("");
  document.getElementById("gaps").innerHTML = R.gaps(D).map(item).join("") || "<p>なし</p>";
  document.getElementById("ceo").innerHTML = R.ceoLoad(D, D.ceoId).map(item).join("") || "<p>なし</p>";
  document.getElementById("single").innerHTML = R.single(D).filter(t => (t.freq === "毎日" || t.freq === "毎週") && t.owner !== D.ceoId).map(item).join("") || "<p>なし</p>";
  document.getElementById("people").innerHTML = R.byPerson(D).map(p =>
    '<details class="person"><summary><span class="pn">' + esc(p.person.name) + '</span><span class="lv ' + p.level + '">' + p.level + '</span><span class="pt">' + esc(p.person.title || "肩書きなし") + "・" + esc(p.person.dept) + (p.person.status !== "在籍" ? "・" + esc(p.person.status) : "") +
    '</span><span class="cnt">主 ' + p.counts.main + "・手伝い " + p.counts.help + "・主担当の重さ " + p.mainWeight + '</span></summary><div class="pbody">' +
    (p.main.length ? "<h4>主にやっている</h4>" + p.main.map(item).join("") : "") + (p.help.length ? "<h4>手伝っている・控え</h4>" + p.help.map(item).join("") : "") + "</div></details>").join("");
  const fA = document.getElementById("fArea"), fF = document.getElementById("fFreq"), fP = document.getElementById("fPerson"), fT = document.getElementById("fText");
  R.AREAS.forEach(a => fA.insertAdjacentHTML("beforeend", "<option>" + a + "</option>"));
  R.FREQS.forEach(a => fF.insertAdjacentHTML("beforeend", "<option>" + a + "</option>"));
  D.people.filter(p => p.status !== "退職").forEach(p => fP.insertAdjacentHTML("beforeend", '<option value="' + esc(p.id) + '">' + esc(p.name) + "</option>"));
  function list(){
    const rows = D.tasks.filter(t => (!fA.value || t.area === fA.value) && (!fF.value || t.freq === fF.value) &&
      (!fP.value || (fP.value === "__none" ? t.owner == null : t.owner === fP.value || (t.helpers || []).includes(fP.value))) &&
      (!fT.value || t.name.includes(fT.value)));
    document.getElementById("list").innerHTML = rows.map(t => "<tr><td>" + esc(t.name) + (t.issue ? "<br><small>⚠ " + esc(t.issue) + "</small>" : "") + '</td><td class="nw">' + esc(t.area) + '</td><td class="nw">' + esc(t.freq) +
      '</td><td class="nw">' + (t.owner ? esc(name(t.owner)) : '<span class="none">なし</span>') + "</td><td>" + (t.helpers || []).map(h => esc(name(h))).join("・") + '</td><td class="nw">' + esc(t.seat || "") + "</td><td>" + ev(t) + "</td></tr>").join("") || '<tr><td colspan="7">この条件の仕事はありません</td></tr>';
  }
  [fA, fF, fP, fT].forEach(el => el.addEventListener("input", list)); list();
  document.getElementById("seats").innerHTML = Object.entries(R.bySeat(D)).sort().map(([seat, v]) => '<tr><td class="nw"><b>' + esc(seat) + "</b></td><td>" + v.tasks.map(t => esc(t.name)).join("／") + "</td><td>" + (v.people.map(p => esc(name(p))).join("・") || '<span class="none">なし</span>') + "</td></tr>").join("");
  document.getElementById("foot").textContent = "元データ：role-map/data/roles.js（Slack 公開チャンネルの読み取り）。顧客の個人情報・個人の評価は入れていません。推測の印がある仕事は、本人に確認してください。";
})();
</script>
</body>
</html>

name: Deploy appraisal-app to Netlify

# main への push で appraisal-app をビルドし、Netlify サイト「ma-appraisal」へ自動公開する。
# 必要なシークレット（リポジトリ Settings → Secrets and variables → Actions）:
#   NETLIFY_AUTH_TOKEN … Netlify の Personal access token（User settings → Applications）
# サイトIDは公開情報なので env に直書き（必要なら NETLIFY_SITE_ID シークレットで上書き）。
# PRは秘密情報なしで検証。手動実行は既定で読み取り専用の接続診断のみ。

on:
  push:
    branches: [main]
    paths:
      - "appraisal-app/**"
      - ".github/workflows/deploy-appraisal-app.yml"
  pull_request:
    paths:
      - "appraisal-app/**"
      - ".github/workflows/deploy-appraisal-app.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "診断成功後、既存の本番サイトに公開する"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: appraisal-netlify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appraisal-app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: appraisal-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck & test
        run: |
          npm run typecheck
          npm run test

      - name: Build
        run: npm run build

      - name: Verify Netlify identity and existing production target
        if: github.event_name != 'pull_request'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID || 'e6431469-8bb5-4d42-8db1-c370eebd5d04' }}
        run: node scripts/netlify-preflight.mjs

      - name: Deploy to Netlify
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID || 'e6431469-8bb5-4d42-8db1-c370eebd5d04' }}
        run: |
          npx --yes netlify-cli@17 deploy \
            --prod \
            --dir=dist \
            --site="$NETLIFY_SITE_ID" \
            --message "CI deploy ${{ github.sha }}"

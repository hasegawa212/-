<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1686" viewBox="0 0 2500 1686" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP','IPAGothic',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FAF8F3"/>
    </linearGradient>
  </defs>
  <rect width="2500" height="1686" fill="url(#bg)"/>

  <!-- 上部の細いゴールドライン（清潔感のあるアクセント） -->
  <rect x="0" y="0" width="2500" height="8" fill="#C2A24C"/>

  <!-- セル区切り（淡いヘアライン） -->
  <g stroke="#ECE7DC" stroke-width="3">
    <line x1="833"  y1="70" x2="833"  y2="1616"/>
    <line x1="1667" y1="70" x2="1667" y2="1616"/>
    <line x1="70" y1="843" x2="2430" y2="843"/>
  </g>

  <!-- 各セル: ゴールドのラインアイコン / 墨の日本語 / 濃ゴールドの英字 -->
  <g fill="none" stroke="#C2A24C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- ① 無料相談: 吹き出し -->
    <g transform="translate(416,300)"><rect x="-58" y="-44" width="116" height="76" rx="16"/><path d="M-20 32 L-2 32 L-34 58 Z" fill="#C2A24C" stroke="none"/></g>
    <!-- ② 売却・査定: 家 + 上矢印 -->
    <g transform="translate(1250,300)"><path d="M-50 4 L0 -40 L50 4"/><path d="M-36 0 V46 H36 V0"/><path d="M0 40 V14 M-12 26 L0 12 L12 26"/></g>
    <!-- ③ 物件を探す: 虫めがね -->
    <g transform="translate(2083,300)"><circle cx="-10" cy="-10" r="36"/><line x1="20" y1="20" x2="52" y2="52"/></g>
    <!-- ④ 建築・リフォーム: ビル -->
    <g transform="translate(416,1143)"><rect x="-48" y="-34" width="40" height="72"/><rect x="6" y="-10" width="40" height="48"/><path d="M-38 -18 H-18 M-38 0 H-18 M-38 18 H-18 M16 2 H36 M16 20 H36"/></g>
    <!-- ⑤ 太陽光: 太陽 -->
    <g transform="translate(1250,1143)"><circle cx="0" cy="0" r="28"/><path d="M0 -52 V-40 M0 40 V52 M-52 0 H-40 M40 0 H52 M-37 -37 L-28 -28 M28 28 L37 37 M37 -37 L28 -28 M-28 28 L-37 37"/></g>
    <!-- ⑥ 電話・アクセス: マップピン -->
    <g transform="translate(2083,1143)"><path d="M0 50 C-34 6 -34 -18 0 -42 C34 -18 34 6 0 50 Z"/><circle cx="0" cy="-10" r="14"/></g>
  </g>

  <!-- 日本語ラベル -->
  <g fill="#1C1C20" font-size="52" font-weight="700" text-anchor="middle" letter-spacing="4">
    <text x="416"  y="470">無料相談</text>
    <text x="1250" y="470">売却・査定</text>
    <text x="2083" y="470">物件を探す</text>
    <text x="416"  y="1313">建築・リフォーム</text>
    <text x="1250" y="1313">太陽光・発電</text>
    <text x="2083" y="1313">電話・アクセス</text>
  </g>

  <!-- 英字タグ -->
  <g fill="#A6812C" font-size="24" font-family="Georgia,'Times New Roman',serif" text-anchor="middle" letter-spacing="6">
    <text x="416"  y="540">CONSULTATION</text>
    <text x="1250" y="540">SELL &amp; APPRAISE</text>
    <text x="2083" y="540">PURCHASE</text>
    <text x="416"  y="1383">BUILD &amp; RENOVATE</text>
    <text x="1250" y="1383">SOLAR</text>
    <text x="2083" y="1383">CONTACT</text>
  </g>
</svg>

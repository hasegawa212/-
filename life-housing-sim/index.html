<style>

  * { box-sizing:border-box; }
  body { margin:0; font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif; color:var(--ink); background:var(--bg); line-height:1.6; }

  .wiz .wopts button { min-height:52px; font:inherit; font-size:16px; padding:10px; border:1.5px solid #c9b48a; background:#fff; border-radius:12px; cursor:pointer; }

  /* 画面共有モード（Zoom・Teams・大型モニター）：入力を隠し、文字を大きく、1画面に収める */
  body.present header { padding:10px 24px; }

  body.present .notes { font-size:12px; }
  .pbar { display:none; }
  body.present .pbar { display:flex; position:fixed; left:0; right:0; bottom:0; gap:12px; align-items:center; justify-content:space-between;
    padding:10px 24px; background:rgba(31,42,68,.96); color:#fff; z-index:5; }
  .pbar button { font:inherit; font-size:16px; border:1px solid rgba(255,255,255,.6); background:transparent; color:#fff; border-radius:8px; padding:8px 18px; cursor:pointer; }
  .pbar button.primary { background:#b08d57; border-color:#b08d57; }

  .toast { position:fixed; left:50%; top:16px; transform:translateX(-50%); background:#1f2a44; color:#fff; padding:10px 18px; border-radius:8px; font-size:14px; z-index:9; display:none; }
  /* 提案書（A4・4ページ） */
  #proposal { display:none; }
  /* お客様に見せる資料（16:9）：1枚＝1280×720。画面では幅に合わせて縮小、印刷は1枚1ページ */

  body.deck-view #deck { display:block; padding:12px 0 40px; }

  .slide .sh { display:flex; align-items:center; gap:16px; padding:26px 48px 0; }

  .slide .sl { font-size:23px; font-weight:700; line-height:1.5; margin:12px 48px 0; padding-left:14px; border-left:6px solid var(--gold); }

  .slide .sp { margin:2px 0 0; padding-left:18px; font-size:14.5px; line-height:1.55; } .slide .sp li { margin:2px 0; }
  .slide .sf { position:absolute; left:48px; right:48px; bottom:16px; display:flex; justify-content:space-between; font-size:12px; color:var(--sub); border-top:1px solid var(--line); padding-top:8px; }
  .slide.cover { background:linear-gradient(135deg,#1f2a44,#0f1626); color:#fff; }

  .slide .nx { list-style:none; padding:0; margin:0; font-size:21px; line-height:1.5; } .slide .nx li { padding:8px 0 8px 44px; position:relative; border-bottom:1px dashed var(--line); }

  .slide .cn { font-size:22px; font-weight:800; color:var(--navy); margin-top:14px; } .slide .nt { font-size:12px; color:var(--sub); line-height:1.5; margin:10px 0 0; padding-left:16px; }

  body.deck-nonotes .snote { display:none; }
  /* 1枚ずつ見せる（スライドショー） */

  .sheet { width:210mm; min-height:297mm; padding:14mm 14mm 12mm; background:#fff; margin:0 auto 12px; box-shadow:0 2px 10px rgba(0,0,0,.08); position:relative; font-size:12.5px; }

  ];
  const opened = window.LHSShare.decode(location.hash, S.defaults());
  // 提案書の宛名・会社情報（この画面の中だけ。共有リンクや保存には入れない）
  const meta = { customer: "", company: S.DEFAULT_COMPANY, staff: "", tel: "" };
  const state = opened.state;
  const fitAns = {}; // 適性チェックの答え（このページの中だけ。保存も共有もしない）
  // お客様ごとに選ぶ項目は空から始める（共有リンクで開いたときは、リンクの条件がそのお客様の数字）
  // 条件（s=）が入ったリンクだけを入力済みとみなす（#step=3 だけのときは、前の画面の続きなので空から）
  const blank = new Set(/(^|[#&])s=/.test(location.hash) ? [] : [...S.ASK_FIELDS, "shataku.self", "shataku.until"]);
  const need = () => S.missing(state, blank);
  const get = (o, p) => p.split(".").reduce((a, k) => a?.[k], o);
  const set = (o, p, v) => { const ks = p.split("."); let a = o; ks.slice(0, -1).forEach((k) => (a = a[k])); a[ks.at(-1)] = v; };

  // ───── 入力は1問ずつ（はじめて開いたとき）：タイプ → お客様ごとの項目 → お名前（任意）→ 確認して説明を始める ─────
  let wizOn = need().length > 0, wizAt = 0;
  const WIZ_HELP = {
    age: "今の年齢を選んでください。",
    income: "源泉徴収票の「支払金額」（税込の年収）。だいたいで大丈夫です。",

    "rent.single": "今の家賃（管理費・共益費こみ）。実家なら「なし」。",
    "shataku.self": "社宅で毎月自分が払っている金額。",
    "shataku.until": "会社の規定で社宅を出る年齢。決まりがなければ「なし」（定年まで社宅として計算）。",
    "own.price": "検討している物件の価格（決まっていなければ目安で）。",
    "lifeIns.monthly": "生命保険・医療保険の毎月の保険料（入っていなければ「なし」）。",

  const WIZ_Q = { age: "今の年齢は？", income: "年収（税込）は？", savings: "今の貯金は？", "nisa.balance": "NISAの残高は？", "nisa.monthly": "NISAで毎月いくら積み立てていますか？",
    "rent.single": "今の家賃（毎月）は？", "shataku.self": "社宅の自己負担（毎月）は？", "shataku.until": "社宅を出る年齢は？", "own.price": "検討している物件の価格は？",
    "lifeIns.monthly": "生命保険の保険料（毎月）は？", "lifeIns.cover": "生命保険の保障額は？" };
  const wizSteps = () => ["type", ...S.askFields(state), "name", "done"];
  const curPreset = () => (state.shataku.on ? "shataku" : state.family.marryAge == null ? "single" : "family");
  function applyPreset(k) {
    const p = S.preset(k);

  const startTalk = () => { wizOn = false; buildForm(); closeForm(); render(); toTop(); }; // 「条件を変える」では全項目を出す
  function buildWizard() {
    const steps = wizSteps(); wizAt = Math.max(0, Math.min(wizAt, steps.length - 1));
    const key = steps[wizAt], n = steps.length, filled = (k) => !blank.has(k);

      const saved = custLoad(), rec = window.LHSCustomers.recent(saved, 3);
      body = (saved.length ? `<div class="wcust" id="wizCust"><b>続きから（保存したお客様）</b>${rec.map((v) => `<button data-c="${esc(v.id)}"><span>${esc(v.name)} 様</span><small>${esc(v.staff || "担当なし")}・${esc((v.updated || "").slice(0, 10))}</small></button>`).join("")}
        <button class="wlink" id="wizCustAll">${saved.length > rec.length ? `ほかのお客様も見る（全${saved.length}人）` : "保存したお客様の一覧"}</button></div><p class="wh" style="margin:10px 0 2px">新しいお客様なら ↓</p>` : "") +
        `<h2 class="wq">お客様のタイプは？</h2><p class="wh">あとから変えられます。</p><div class="wopts w1">${Object.entries(S.PRESETS).map(([k, v]) =>
        `<button data-p="${k}" class="${k === curPreset() ? "on" : ""}">${esc(v)}</button>`).join("")}</div>`;
    } else if (key === "name") {
      body = `<h2 class="wq">提案書のお名前（なくても大丈夫）</h2><p class="wh">提案書の表紙にだけ使います。共有リンクや保存には入りません。</p>` +
        [["customer", "お客様のお名前"], ["staff", "担当者"]].map(([k, l]) => `<label class="wtext">${l}<input type="text" data-m="${k}" value="${esc(meta[k] || "")}" autocomplete="off"></label>`).join("");
    } else if (key === "done") {
      const x = S.compute(state);
      body = `<h2 class="wq">この条件で説明を始めます</h2><p class="wh">${esc(S.proposal(x).cover.profile)}</p>
        <ul class="wsum">${S.askFields(state).map((k) => { const f = FIELDS.find((v) => v[0] === k), lb = k === "nisa.monthly" ? "NISAの毎月の積立" : (WIZ_Q[k] || f[1]).replace(/は？$/, "");
          return `<li><button data-j="${steps.indexOf(k)}" title="変える"><span>${esc(lb)}</span><b>${esc(f[3](get(state, k)))} ›</b></button></li>`; }).join("")}</ul><p class="wh" style="margin-top:6px">変えたい項目を押すと、その質問に戻ります。</p>
        <button class="startbtn" id="wizStart">この条件で説明を始める ›</button><button class="wlink" id="wizSave">このお客様を保存する（担当ごと）</button><button class="wlink" id="wizFull">金利・老後の生活費など、詳しい条件も見る</button>`;
    } else {
      const f = FIELDS.find((v) => v[0] === key), [, label, opts, fmt] = f, cur = get(state, key), has = filled(key);
      canNext = has;
      body = `<h2 class="wq">${esc(WIZ_Q[key] || label + "は？")}</h2><p class="wh">${esc(WIZ_HELP[key] || "")}</p>` + (opts.length <= 12
        ? `<div class="wopts">${opts.map((v, i) => `<button data-i="${i}" class="${has && v === cur ? "on" : ""}">${esc(fmt(v))}</button>`).join("")}</div>`
        : `<select class="wsel" data-k="${key}">${has ? "" : `<option value="" selected>選んでください</option>`}${opts.map((v, i) => `<option value="${i}"${has && v === cur ? " selected" : ""}>${esc(fmt(v))}</option>`).join("")}</select>`);
    }
    const last = key === "done";
    $("form").innerHTML = `<div class="wiz" id="wiz"><div class="wtop"><span>質問 ${wizAt + 1} / ${n}</span><div class="wbar"><i style="width:${((wizAt + 1) / n) * 100}%"></i></div></div>${body}
      <div class="wnav"><button id="wizBack"${wizAt === 0 ? " disabled" : ""}>← 戻る</button>${last ? "" : `<button class="primary" id="wizNext"${canNext ? "" : " disabled"}>次へ →</button>`}</div></div>`;
    const go = (d) => { wizAt += d; buildWizard(); $("form").scrollIntoView({ block: "start" }); };
    $("wizBack").onclick = () => go(-1);
    if (!last) $("wizNext").onclick = () => go(1);

    $("form").querySelectorAll(".wcust button[data-c]").forEach((b) => (b.onclick = () => { const v = custLoad().find((r) => r.id === b.dataset.c); if (v) custOpenRec(v); }));

    if (key !== "type" && key !== "name" && key !== "done") {

    $("form").querySelectorAll("input[data-m]").forEach((el) => (el.oninput = () => { meta[el.dataset.m] = el.value; }));
    $("form").querySelectorAll(".wsum button[data-j]").forEach((b) => (b.onclick = () => { wizAt = +b.dataset.j; buildWizard(); }));
    if (last) { $("wizSave").onclick = () => custOpen(true); $("wizStart").onclick = startTalk; $("wizFull").onclick = () => { wizOn = false; buildForm(); $("form").scrollIntoView({ block: "start" }); }; }
  }
  function buildForm() {
    if (wizOn) return buildWizard();
    const curP = state.shataku.on ? "shataku" : state.family.marryAge == null ? "single" : "family";
    let h = `<h2>お客様のタイプ</h2><div class="preset">${Object.entries(S.PRESETS).map(([k, v]) =>
      `<button data-p="${k}" class="${k === curP ? "on" : ""}">${esc(v)}</button>`).join("")}</div>`;
    for (const f of FIELDS) {
      if (f.length === 1) { h += `<h2>${esc(f[0])}</h2>`; continue; }

      h += `<label class="${empty ? "need" : ""}">${esc(label)}<select data-k="${key}">${empty ? `<option value="" selected>選んでください</option>` : ""}${opts.map((v, i) => `<option value="${i}"${!empty && v === cur ? " selected" : ""}>${esc(fmt(v))}</option>`).join("")}</select></label>`;

  function updStart() {
    const n = need().length, b = $("startBtn");

    b.textContent = n ? `あと${n}項目 選んでください` : "この条件で説明を始める ›";

  const firstNeed = () => { const el = $("form").querySelector("label.need select"); if (el) { el.scrollIntoView({ block: "center" }); el.focus(); } };
  // 空の項目があるあいだは、数字の画面（トップ・説明・提案書・資料）を開かず入力へ
  const guard = () => { if (!need().length) return false; document.body.classList.remove("home-view", "present", "proposal-view", "deck-view", "form-closed"); render(); window.scrollTo(0, 0); toast(`お客様の数字を入れてください（あと${need().length}項目）`); return true; };

  // ───── グラフ（SVG・手書き） ─────
  function lineChart(x) {
    const W = 720, H = 260, L = 64, B = 30, T = 14;
    let cr = 0, co = 0;
    const pts = x.years.map((y) => ({ age: y.age, r: (cr += y.rentYear), o: (co += y.ownYear) }));
    const max = Math.max(cr, co) * 1.05, a0 = pts[0].age, a1 = pts.at(-1).age;
    const X = (a) => L + ((a - a0) / (a1 - a0)) * (W - L - 12), Y = (v) => T + (1 - v / max) * (H - T - B);
    const path = (k) => pts.map((p, i) => `${i ? "L" : "M"}${X(p.age).toFixed(1)},${Y(p[k]).toFixed(1)}`).join("");
    let g = "";
    for (let v = 0; v <= max; v += 10_000_000) g += `<line x1="${L}" x2="${W - 12}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eceef1"/><text x="${L - 6}" y="${Y(v) + 4}" font-size="11" text-anchor="end" fill="#5b616b">${(v / 1e4).toLocaleString()}万</text>`;
    for (let a = Math.ceil(a0 / 10) * 10; a <= a1; a += 10) g += `<text x="${X(a)}" y="${H - 10}" font-size="11" text-anchor="middle" fill="#5b616b">${a}歳</text>`;
    const ret = x.input.retireAge;
    g += `<line x1="${X(ret)}" x2="${X(ret)}" y1="${T}" y2="${H - B}" stroke="#b08d57" stroke-dasharray="4 4"/><text x="${X(ret) + 4}" y="${T + 12}" font-size="11" fill="#b08d57">${ret}歳（年金生活）</text>`;
    const end = pts.at(-1);
    g += `<path d="${path("r")}" fill="none" stroke="var(--rent)" stroke-width="3"/><path d="${path("o")}" fill="none" stroke="var(--own)" stroke-width="3"/>`;
    // 上の線のラベルは線の上、下の線のラベルは線の下（どちらが上でも重ならない）
    // 下の線のラベルは、文字の幅のぶん左の線の位置より下に置く（右上がりの線と文字が重ならない）
    const rentUp = end.r >= end.o, back = pts.find((p) => p.age >= end.age - Math.ceil(120 / ((W - L - 12) / (a1 - a0)))) || pts[0];
    const below = (k) => Math.max(Y(end[k]), Y(back[k])) + 15;
    g += `<text x="${X(end.age) - 4}" y="${rentUp ? Y(end.r) - 6 : below("r")}" font-size="12" text-anchor="end" fill="var(--rent)" font-weight="700">賃貸 ${man(end.r)}</text>`;
    g += `<text x="${X(end.age) - 4}" y="${rentUp ? below("o") : Y(end.o) - 6}" font-size="12" text-anchor="end" fill="var(--own)" font-weight="700">持ち家 ${man(end.o)}</text>`;
    return `<div class="legend"><span><i style="background:var(--rent)"></i>賃貸のまま（累計）</span><span><i style="background:var(--own)"></i>持ち家（累計）</span></div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="住居費の累計">${g}</svg>`;
  }
  function oldBars(x) {
    const rows = [["年金（概算）", x.pension.monthly, "#2e7d32"], ["賃貸のままの支出", x.old.rent.outMonthly, "var(--rent)"], ["持ち家の支出", x.old.own.outMonthly, "var(--own)"]];
    const max = Math.max(...rows.map((r) => r[1])) * 1.1, W = 720, rowH = 44;
    let g = "";
    rows.forEach(([lb, v, c], i) => {
      const y = 8 + i * rowH, w = (v / max) * (W - 200);
      g += `<text x="0" y="${y + 20}" font-size="13" fill="#1d1f23">${lb}</text><rect x="150" y="${y + 4}" width="${w}" height="24" rx="4" fill="${c}"/><text x="${156 + w}" y="${y + 21}" font-size="13" font-weight="700" fill="${c}">毎月 ${man(v, 1)}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${rows.length * rowH + 10}" width="100%" role="img" aria-label="老後の毎月">${g}</svg>`;
  }
  function stageTable(x) {
    const segs = [];
    for (const y of x.years) { const last = segs.at(-1); if (last && last.label === y.stageLabel) last.to = y.age; else segs.push({ label: y.stageLabel, from: y.age, to: y.age, rent: y.rentMonthly }); }
    return `<table><tr><th>暮らしの段階</th><th>年齢</th><th>家賃（毎月）</th></tr>${segs.map((s) => `<tr><td>${s.label}</td><td>${s.from}〜${s.to}歳</td><td>${s.rent ? man(s.rent, 1) : "なし"}</td></tr>`).join("")}</table>`;
  }

  function hbars(rows, unit = "") {
    const W = 560, rowH = 34, max = Math.max(...rows.map((r) => r.parts.reduce((s2, p) => s2 + p[1], 0))) * 1.12 || 1;
    let g = "";
    rows.forEach((r, i) => {
      const y = 4 + i * rowH; let x0 = 130, total = 0;
      g += `<text x="0" y="${y + 18}" font-size="13" fill="#1d1f23">${esc(r.label)}</text>`;
      for (const [nm, v, c] of r.parts) {
        const w2 = (v / max) * (W - 230);
        if (w2 > 0) g += `<rect x="${x0}" y="${y + 4}" width="${w2}" height="20" fill="${c}" rx="2"><title>${esc(nm)} ${man(v)}</title></rect>`;
        x0 += w2; total += v;
      }
      g += `<text x="${x0 + 6}" y="${y + 19}" font-size="13" font-weight="700" fill="#1d1f23">${r.text || man(total) + unit}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${rows.length * rowH + 8}" width="100%" role="img">${g}</svg>`;
  }
  const legend = (items) => `<div class="legend">${items.map(([n, c]) => `<span><i style="background:${c};height:10px"></i>${esc(n)}</span>`).join("")}</div>`;
  function portfolioView(x) {

      <div class="kpi"><span>これから一生で入ってくるお金</span><b>${man(inc.total)}</b><span>給料 ${man(inc.salaryMe + inc.salaryPartner)}＋年金 ${man(inc.pension)}</span></div>

      <div class="two"><div><p class="small" style="margin:0 0 4px"><b>年収と、一生で入ってくるお金</b></p>${hbars([
        { label: "あなたの年収", parts: [["年収", x.input.income, C.sal]] },

      ])}${hbars([

        { label: "住まい（賃貸）", parts: [["賃貸", x.life.rent, "var(--rent)"]], text: `${man(x.life.rent)}（${Math.round(inc.housingShare.rent * 100)}%）` },
        { label: "住まい（持ち家）", parts: [["持ち家", x.life.own, "var(--own)"]], text: `${man(x.life.own)}（${Math.round(inc.housingShare.own * 100)}%）` },
      ])}${legend([["給料", C.sal], ["年金", C.pen]])}</div>
      <div><p class="small" style="margin:0 0 4px"><b>${x.input.retireAge}歳のときの資産（ポートフォリオ）</b></p>${hbars([
        { label: "今", parts: [["預貯金", pf.now.savings, C.sav], ["NISA", pf.now.nisa, C.nisa]] },
        { label: `${x.input.retireAge}歳・賃貸のまま`, parts: [["預貯金", pf.at65.rent.savings, C.sav], ["NISA", pf.at65.rent.nisa, C.nisa]] },
        { label: `${x.input.retireAge}歳・持ち家`, parts: [["預貯金", pf.at65.own.savings, C.sav], ["NISA", pf.at65.own.nisa, C.nisa], ["不動産", pf.at65.own.realEstate, C.re]] },
      ])}${legend([["預貯金", C.sav], ["NISA", C.nisa], ["不動産（家の価値−残りのローン）", C.re]])}

  // 1280×720 の枠に収まらない図は、その枠の中だけ縮める（文字の大きさは保つ）
  function fitDeck() {
    const show = document.body.classList.contains("deck-show");
    const W = show ? window.innerWidth : Math.min(window.innerWidth - 24, 1280), H = show ? window.innerHeight - 64 : Infinity;
    const sc = Math.min(1, W / 1280, H / 720);
    document.querySelectorAll("#deck .swrap").forEach((w, k) => {
      w.classList.toggle("cur", k === deckCur);
      const sl = w.firstElementChild; sl.style.transform = `scale(${sc})`;
      w.style.width = 1280 * sc + "px"; w.style.height = 720 * sc + "px";
    });
    document.querySelectorAll("#deck .sv, #deck .sk").forEach((v) => {
      v.style.zoom = 1;
      const r = Math.min(1, v.clientHeight / v.scrollHeight, v.clientWidth / v.scrollWidth);
      if (r < 1) v.style.zoom = Math.max(0.45, r * 0.98);
    });
    const n = document.querySelectorAll("#deck .swrap").length;
    $("dCount").textContent = show ? `${deckCur + 1} / ${n}` : `全${n}枚`;
  }

    if (h.go === "form") { document.body.classList.remove("home-view"); return openForm(); }
    if (guard()) return; // 入力がまだなら入力へ（見本の数字は出さない）
    if (h.go === "home") return openHome();
    closeForm();
    if (h.area) return openStep(S.home(S.compute(state), missionDone, meta).areas.find((a) => a.key === h.area).step);
    if (h.talk) return openStep(S.talk(S.compute(state)).findIndex((t) => t.title.startsWith(h.talk)));
    openStep(h.step);
  }
  // トップの看板の「はじめる」：入力がまだなら入力へ、済んでいればトップページの中身へ
  $("heroGo").onclick = () => { const t = document.body.classList.contains("home-view") ? $("home") : need().length ? $("form").querySelector("label.need select") || $("form") : $("form"); t.scrollIntoView({ behavior: "smooth", block: need().length ? "center" : "start" }); };
  buildForm(); if (opened.present) document.body.classList.add("present");
  // 共有リンクで開いた・前に入力を済ませた・ステップを指定して開いた → 入力は畳んで始める
  let formDone = false;
  for (const st of ["localStorage", "sessionStorage"]) { try { if (window[st].getItem("lhs_form_done") === "1") formDone = true; } catch (e) { /* なし */ } }
  if (!need().length && (formDone || /(^|[#&])s=/.test(location.hash) || opened.step > 0)) document.body.classList.add("form-closed");
  render();
  // 最初に開いたときはトップページ（共有リンクで step・画面共有の指定があるときはそのステップから）。入力がまだなら入力から
  if (!need().length && !opened.present && !/step=/.test(location.hash)) openHome();
})();
</script>
</body>
</html>

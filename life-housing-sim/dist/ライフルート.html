      const lab = short.length > 10 ? short.slice(0, 9) + "…" : short;
      const w = lab.length * 15 + 58, right = pt.x < 520, tx = right ? pt.x + 22 : pt.x - 22 - w;
      return `<g class="ms" data-age="${m.age}" tabindex="0" role="button" aria-label="${esc(m.age + "歳 " + m.label + " " + m.stat)}">
        <circle cx="${pt.x}" cy="${pt.y}" r="17" fill="#0b1630" stroke="#f2cd73" stroke-width="3"/>
        <text x="${pt.x}" y="${pt.y + 5}" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">${m.age}</text>
        <rect x="${tx}" y="${pt.y - 14}" width="${w}" height="28" rx="14" fill="rgba(8,16,34,.86)" stroke="#d9b968"/>
        <text x="${tx + 14}" y="${pt.y + 5}" font-size="14" font-weight="700" fill="#fff">${m.age}歳 ${esc(lab)}</text></g>`;
    }).join("");
  }
  // 1つの年齢を選ぶと、地図の印・グラフの点・ライフイベントの行が一緒に光り、数字の説明が出る
  function focusAge(age, ms) {
    const m = ms.find((v) => v.age === age) || ms[0];
    focusAge.cur = m.age;
    $("home").querySelectorAll("[data-age]").forEach((el) => el.classList.toggle("hl", +el.dataset.age === m.age));
    $("mDetail").innerHTML = `<b>${m.age}歳　${esc(m.label)}</b><span>${esc(m.stat)}</span><span class="as">この年の資産（持ち家の場合・概算）${esc(man(m.assets))}</span>`;
  }
  function ring(pct) {
    const r = 34, c = 2 * Math.PI * r;
    return `<svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="${r}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="9"/>
      <circle cx="48" cy="48" r="${r}" fill="none" stroke="#f2cd73" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(c * pct).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 48 48)"/>
      <text x="48" y="54" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">${Math.round(pct * 100)}%</text></svg>`;
  }
  const NAV = [["top", "マイページ", "home"], ["map", "お金の全体像", 0], ["life", "暮らしの段階", 1], ["home", "一生の住居費", 2], ["old", "65歳からの暮らし", 3], ["nisa", "持たない場合の準備", 4], ["ins", "もしものとき", 5], ["plan", "まとめ", 6], ["cash", "「今はいい」と思ったら", 7], ["doc", "提案書（PDF）", "proposal"], ["zoom", "画面共有（Zoom）", "present"], ["gear", "条件を変える", "form"]];
  const POS = { nisa: [2, 4], home: [2, 30], ins: [76, 4], plan: [76, 30], cash: [76, 56] };
  function homeHtml(x) {
    const h = S.home(x, missionDone, meta), A = h.assets;
    const DOT = { realEstate: "#e7b84a", nisa: "#26c6b5", savings: "#3b82f6" };
    const open = h.missions.filter((m) => !m.done).length;
    const areaCard = (a) => `<button class="area" style="left:${POS[a.key][0]}%;top:${POS[a.key][1]}%" data-step="${a.step}" title="${esc(a.value)}">
        <div class="t">${ico(a.key, 26)}<span>${esc(a.label)}</span></div><div class="s">${esc(a.sub)}</div>
        <div class="lvrow" title="このエリアのやることのうち、できた数">${esc(a.readiness)}<span class="bar${a.key === "nisa" ? " blue" : ""}"><i style="width:${Math.max(6, a.progress * 100)}%"></i></span></div>
        <div class="bg"><b>${esc(a.big)}</b><span>${esc(a.bigLabel)}</span></div></button>`;
    return `<div class="hh">
        <div class="logo">${ico("plan", 40)}<div><b>${esc(h.hero.company || "会社名")}</b><small>LIFE ROUTE</small></div></div>
        <div class="ttl"><h1 class="gold">${esc(h.hero.title)}<span class="kana">${esc(h.hero.kana)}</span></h1><p>${esc(h.hero.catch)}</p></div>
        <div class="who"><div class="av">${ico("old", 26, "#fff")}</div><div><input id="hName" placeholder="お名前を入力" value="${esc(meta.customer || "")}" aria-label="お客様のお名前"><span style="font-size:13px"> 様</span>
          <div class="lv" title="${esc(h.hero.howto)}">${esc(h.hero.readiness)}　<span style="color:#cfd8e8;font-weight:400">${h.hero.age}歳からの物語</span></div><div style="font-size:11px;color:#cfd8e8">${esc(h.hero.howto)}</div></div></div>
      </div>
      <div class="hgrid">
        <div>
          <nav class="glass hnav">${NAV.map(([ic, l, t]) => `<button data-go="${t}" class="${t === "home" ? "on" : ""}">${ico(ic)}<span>${esc(l)}</span></button>`).join("")}</nav>
          <div class="glass mis"><h3>${ico("doc")}やること<span class="n">${open}</span></h3>
            ${h.missions.map((m) => `<label class="${m.auto ? "auto" : ""}"><input type="checkbox" data-m="${m.id}" ${m.done ? "checked" : ""} ${m.auto ? "disabled" : ""}><span class="${m.done ? "d" : ""}">${esc(m.label)}${m.auto ? "（自動）" : ""}</span></label>`).join("")}
          </div>
        </div>
        <div>
          <div class="map">${mapArt()}
            <span class="pin" style="left:56%;top:12%">GOAL ${x.input.retireAge}歳</span>
            ${h.areas.map(areaCard).join("")}
            ${heroArt()}<span class="flag">${esc(h.hero.name)}（${h.hero.age}歳）</span>
            <div class="mdetail" id="mDetail" aria-live="polite"></div>
            <button class="nextbtn" data-step="0">次のステージへ ›</button>
          </div>
          <div class="glass acts"><h3>${ico("top")}おすすめのアクション</h3><div class="row">
            ${h.actions.map((a, k) => `<button class="act" data-${a.go ? "go" : "step"}="${a.go || a.step}" style="background:${["linear-gradient(135deg,#1c5a52,#0d2a2a)", "linear-gradient(135deg,#6b4a1e,#2a1c0b)", "linear-gradient(135deg,#3d2a58,#171028)", "linear-gradient(135deg,#1e3f73,#0c1a33)"][k]}">${ico(a.icon, 74, "rgba(255,255,255,.5)")}<b>${esc(a.title)}</b><span>${esc(a.sub)}</span><em>${a.go ? "つくる" : "見る"} ›</em></button>`).join("")}
          </div></div>
        </div>
        <div>
          <div class="glass rc"><h3>今の資産</h3><div class="big">${esc(man(A.now).replace("万円", ""))}<small>万円</small></div>
            <div class="sub">${x.input.retireAge}歳の見通し（概算）　持ち家 ${esc(man(A.at65.own))}／賃貸のまま ${esc(man(A.at65.rent))}</div>
            ${sparkline(A.path, h.milestones)}<div class="sub">━ 持ち家の場合　┅ 賃貸のまま（NISA年${(x.input.nisa.rate * 100).toFixed(0)}%と仮定・元本保証なし）</div>
            <ul>${A.parts.map((p) => `<li><span class="dot" style="background:${DOT[p.key]}"></span><span>${esc(p.label)}</span><span class="r">${Math.round(p.share * 100)}%</span><span class="r">${esc(man(p.amount))}</span></li>`).join("")}
              <li><span class="dot" style="background:#a78bfa"></span><span>保険</span><span class="r"></span><span class="r">毎月 ${esc(man(x.input.lifeIns.monthly, 1))}</span></li></ul></div>
          <div class="glass rc"><h3>人生の目標</h3><div class="ring">${ring(h.goal.pct)}<div><div style="font-size:13px;font-weight:700">${esc(h.goal.label)}</div>
            <div class="sub">目標 ${esc(man(h.goal.target))}（持ち家なら ${esc(man(h.goal.ownTarget))}）</div><div class="sub">今 ${esc(man(h.goal.now))}</div></div></div></div>
          <div class="glass rc"><h3>ライフイベント</h3><ul class="ev">${h.events.map((e, k) => `<li class="${k === 0 ? "now" : ""}" data-age="${Math.min(e.age, x.input.retireAge)}"><b>${e.age}歳</b><span>${esc(e.label)}<small>${esc(e.stat)}</small></span></li>`).join("")}</ul></div>
        </div>
      </div>
      <p class="hnote">数字はすべて、このシミュレーションの条件から計算した概算です（将来の価格・運用の結果を約束するものではありません）。やることのチェックとお名前は、この画面の中だけで使い、保存・共有しません。</p>`;
  }
  function renderHome() {
    const x = S.compute(state);
    $("home").innerHTML = homeHtml(x);
    const H = S.home(x, missionDone, meta);
    placeMilestones(H.milestones);
    $("home").querySelectorAll("[data-age]").forEach((el) => {
      const on = () => focusAge(+el.dataset.age, H.milestones);
      el.addEventListener("mouseenter", on); el.addEventListener("click", on); el.addEventListener("focus", on);
    });
    focusAge(focusAge.cur ?? H.milestones[0].age, H.milestones);
    $("home").querySelectorAll("[data-step]").forEach((b) => (b.onclick = () => openStep(+b.dataset.step)));
    $("home").querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => {
      const g = b.dataset.go;
      if (g === "home") return;
      if (/^\d+$/.test(g)) return openStep(+g);
      if (g === "proposal") { document.body.classList.remove("home-view"); return showProposal(); }
      if (g === "present") { document.body.classList.remove("home-view"); return present(true); }
      if (g === "form") { openStep(cur); $("form").scrollIntoView(); }
    }));
    $("home").querySelectorAll("input[data-m]").forEach((el) => (el.onchange = () => { missionDone[el.dataset.m] = el.checked; renderHome(); }));
    const nm = $("hName");
    nm.oninput = () => { meta.customer = nm.value; const f = $("form").querySelector('input[data-m="customer"]'); if (f) f.value = nm.value; };
    nm.onchange = () => { renderHome(); $("hName").focus(); };
  }
  function openHome() { document.body.classList.remove("present", "proposal-view"); document.body.classList.add("home-view"); renderHome(); window.scrollTo(0, 0); }
  function openStep(i) { document.body.classList.remove("home-view"); cur = i; all = false; render(); window.scrollTo(0, 0); }
  let cur = opened.step, all = false, LAST = 9;
  const toast = (t) => { const el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => (el.style.display = "none"), 2200); };
  const present = (on) => { document.body.classList.toggle("present", on); all = false; render(); };
  const syncUrl = () => { try { history.replaceState(null, "", window.LHSShare.encode(state, { step: cur, present: document.body.classList.contains("present"), defaults: S.defaults() }) || "#"); } catch (e) { /* file:// などで使えない場合は何もしない */ } };
  function render() {
    const x = S.compute(state), steps = S.talk(x);
    $("fbText").innerHTML = `<b>条件</b>　${esc(S.proposal(x).cover.profile)}`;
    LAST = steps.length - 1;
    const visual = [
      fixedView(x),
      portfolioView(x),
      stageTable(x),
      `<div class="kpis dup"><div class="kpi rent"><span>一生の住居費（賃貸のまま）</span><b>${man(x.life.rent)}</b></div><div class="kpi own"><span>一生の住居費（持ち家・控除後）</span><b>${man(x.life.own)}</b></div><div class="kpi"><span>住宅ローン控除で戻る税金</span><b style="color:var(--ok)">${man(x.credit.total)}</b><span>${x.credit.years}年・1年目 ${man(x.credit.first, 1)}</span></div></div><div class="two"><div>${lineChart(x)}${breakdownNote(x)}</div><div>${breakdownTable(x)}</div></div>`,
      oldBars(x) + `<div class="kpis"><div class="kpi rent"><span>老後の毎月の不足（賃貸）</span><b>${man(x.old.rent.gapMonthly, 1)}</b></div><div class="kpi own"><span>老後の毎月の不足（持ち家）</span><b>${man(x.old.own.gapMonthly, 1)}</b></div><div class="kpi"><span>老後${x.old.years}年の家賃の合計</span><b>${man(x.old.rent.rentTotal)}</b></div></div>`,
      `<div class="kpis"><div class="kpi rent"><span>${state.retireAge}歳までに準備（賃貸のまま）</span><b>${man(x.prepare.rentNeed)}</b><span>毎月 ${man(x.prepare.monthlyRent, 1)} の積立</span></div><div class="kpi own"><span>${state.retireAge}歳までに準備（持ち家）</span><b>${man(x.prepare.ownNeed)}</b><span>毎月 ${man(x.prepare.monthlyOwn, 1)} の積立</span></div><div class="kpi"><span>差</span><b>${man(x.prepare.rentExtra)}</b><span>持たない場合に多く必要</span></div></div>`,
      `<div class="kpis"><div class="kpi rent"><span>老後の賃貸の入居審査（家賃÷年金）</span><b>${Math.round(x.screening.rent.ratioOld * 100)}%</b><span>目安は3分の1（33%）以内${x.screening.rent.hard ? "・通りにくくなる場合あり" : ""}</span></div><div class="kpi own"><span>万一のとき残るローン（団信）</span><b>${man(0)}</b><span>${x.input.family.marryAge == null ? "親や兄弟に残らない" : "家族に住まいが残る"}</span></div>${x.input.family.marryAge == null ? "" : `<div class="kpi rent"><span>賃貸なら家族が払い続ける家賃</span><b>${man(x.whatIf.danshinRentContinues, 1)}</b><span>毎月</span></div>`}<div class="kpi"><span>金利が1%上がったら</span><b>${man(x.whatIf.rateUpPmt, 1)}</b><span>今の計画 ${man(x.whatIf.pmt, 1)}／毎月</span></div></div>${danshinView(x)}`,
      gateView(x),
      recommendView(x),
      waitView(x),
    ];
    $("tabs").innerHTML = `<button class="home" data-home="1" title="トップ（LIFE ROUTE）">★</button>` + steps.map((s, i) => `<button class="${i === cur && !all ? "on" : ""}" data-i="${i}">${esc(s.title.slice(0, 1))}</button>`).join("");
    $("tabs").querySelectorAll("button").forEach((b) => (b.onclick = () => { if (b.dataset.home) return openHome(); cur = +b.dataset.i; all = false; closeForm(); render(); toTop(); }));
    $("steps").innerHTML = steps.map((s, i) => `<div class="step" style="display:${all || i === cur ? "block" : "none"}">
      <h2 class="stage-title">${esc(s.title)}</h2><p class="say">${esc(s.say)}</p>${visual[i]}<p class="show">${esc(s.show)}</p><p class="ask">${esc(s.ask)}</p></div>`).join("");
    $("steps").querySelectorAll(".rentimg img").forEach((im) => (im.onclick = () => { const z = $("imgzoom"); z.querySelector("img").src = im.src; z.querySelector("img").alt = im.alt; z.classList.add("on"); }));
    $("prev").disabled = cur === 0; $("next").disabled = cur === steps.length - 1;
    $("notes").innerHTML = S.NOTES.map((n) => `<li>${esc(n)}</li>`).join("");
    $("pCount").textContent = `${cur + 1} / ${steps.length}`;
    syncUrl();
  }
  // ページを移ったら、いつもいちばん上から
  const toTop = () => { window.scrollTo(0, 0); document.querySelectorAll("main, .result, #steps").forEach((el) => (el.scrollTop = 0)); };
  // 入力は最初に1回だけ：説明を始めたら畳み、次からは「条件を変える」で開く（「入力済み」だけをこの端末に覚える。条件やお名前は保存しない）
  function closeForm() { document.body.classList.add("form-closed"); for (const st of ["localStorage", "sessionStorage"]) { try { window[st].setItem("lhs_form_done", "1"); } catch (e) { /* 使えなくても動く */ } } }
  function openForm() { document.body.classList.remove("form-closed", "present"); render(); window.scrollTo(0, 0); }
  $("fbOpen").onclick = openForm;
  const go = (d) => { cur = Math.min(LAST, Math.max(0, cur + d)); all = false; closeForm(); render(); toTop(); };
  $("present").onclick = () => present(true);
  $("prop").onclick = showProposal;
  $("deckBtn").onclick = showDeck;
  $("dBack").onclick = () => { deckShow(false); document.body.classList.remove("deck-view"); render(); };
  $("dShow").onclick = () => deckShow(!document.body.classList.contains("deck-show"));
  $("dPrev").onclick = () => deckGo(-1); $("dNext").onclick = () => deckGo(1);
  $("dNotes").onchange = () => document.body.classList.toggle("deck-nonotes", !$("dNotes").checked);
  $("dPrint").onclick = () => window.print();
  window.addEventListener("resize", () => { if (document.body.classList.contains("deck-view")) fitDeck(); });
  $("pvBack").onclick = () => { document.body.classList.remove("proposal-view"); render(); };
  $("pvPrint").onclick = () => window.print();
  $("pExit").onclick = () => { present(false); openForm(); };
  $("pPrev").onclick = () => go(-1);
  $("pNext").onclick = () => go(1);
  const full = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); };
  $("pFull").onclick = full;
  $("link").onclick = async () => {
    const url = location.href.split("#")[0] + window.LHSShare.encode(state, { step: 0, present: true, defaults: S.defaults() });
    try { await navigator.clipboard.writeText(url); toast("共有リンクをコピーしました（条件の数字だけが入り、お名前は入りません）"); }
    catch (e) { prompt("このリンクをコピーしてください", url); }
  };
  $("imgzoom").onclick = () => $("imgzoom").classList.remove("on");
  document.addEventListener("keydown", (e) => {
    if (document.body.classList.contains("deck-show") && !$("imgzoom").classList.contains("on")) {
      if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); deckGo(1); }
      else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); deckGo(-1); }
      else if (e.key === "Escape") deckShow(false);
      else if (e.key === "f" || e.key === "F") full();
      return;
    }
    if (document.body.classList.contains("deck-view")) return;
    if ($("imgzoom").classList.contains("on")) { if (e.key === "Escape" || e.key === " " || e.key === "Enter") { $("imgzoom").classList.remove("on"); e.preventDefault(); } return; }
    if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    if (document.body.classList.contains("home-view")) return;
    if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(1); }
    else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(-1); }
    else if (e.key === "p" || e.key === "P") present(!document.body.classList.contains("present"));
    else if (e.key === "f" || e.key === "F") full();
    else if (e.key === "Escape" && document.body.classList.contains("present") && !document.fullscreenElement) present(false);
  });
  $("prev").onclick = () => go(-1);
  $("next").onclick = () => go(1);
  $("all").onclick = () => { all = !all; render(); };
  $("print").onclick = () => { all = true; render(); window.print(); };
  $("toHome").onclick = openHome;
  buildForm(); if (opened.present) document.body.classList.add("present");
  // 共有リンクで開いた・前に入力を済ませた・ステップを指定して開いた → 入力は畳んで始める
  let formDone = false;
  for (const st of ["localStorage", "sessionStorage"]) { try { if (window[st].getItem("lhs_form_done") === "1") formDone = true; } catch (e) { /* なし */ } }
  if (formDone || /(^|[#&])s=/.test(location.hash) || opened.step > 0) document.body.classList.add("form-closed");
  render();
  // 最初に開いたときはトップページ（共有リンクで step・画面共有の指定があるときはそのステップから）
  if (!opened.present && !/step=/.test(location.hash)) openHome();
})();
</script>
</body>
</html>

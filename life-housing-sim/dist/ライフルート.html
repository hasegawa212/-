<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIFE ROUTE（ライフルート）｜住まいとお金、95歳までの道のり</title>
<style>
  :root { --navy:#1f2a44; --gold:#b08d57; --ink:#1d1f23; --sub:#5b616b; --line:#dcdfe4; --bg:#f6f4ef; --card:#fff;
          --rent:#c2581e; --own:#2a5c9a; --ok:#2e7d32; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif; color:var(--ink); background:var(--bg); line-height:1.6; }
  header { background:var(--navy); color:#fff; padding:14px 20px; display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; }
  header h1 { margin:0; font-size:19px; letter-spacing:.05em; }
  header p { margin:0; font-size:12px; opacity:.8; }
  main { display:grid; grid-template-columns:minmax(260px,330px) 1fr; gap:16px; padding:16px; max-width:1400px; margin:0 auto; }
  @media (max-width:920px){ main{ grid-template-columns:1fr; } }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .form h2 { font-size:13px; color:var(--navy); margin:12px 0 6px; border-left:4px solid var(--gold); padding-left:7px; }
  .form h2:first-child { margin-top:0; }
  label { display:grid; grid-template-columns:1fr 150px; gap:8px; align-items:center; font-size:13px; margin:5px 0; }
  select { max-width:150px; }
  .preset { display:flex; gap:6px; margin:2px 0 6px; }
  .preset button { flex:1; font:inherit; font-size:13px; padding:7px 8px; border:1px solid #c9b48a; background:#fff; border-radius:8px; cursor:pointer; }
  .preset button.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  .two { display:grid; grid-template-columns:1.15fr 1fr; gap:16px; align-items:start; }
  @media (max-width:920px){ .two{ grid-template-columns:1fr; } }
  .bd td.minus { color:var(--ok); }
  .bd tr.sum td { font-weight:700; border-top:2px solid var(--navy); }
  .bd td.rent { color:var(--rent); } .bd td.own { color:var(--own); }
  .small { font-size:12px; color:var(--sub); margin:6px 0 0; }
  select { font:inherit; font-size:13px; padding:5px 6px; border:1px solid #c9b48a; border-radius:7px; background:#fff8e6; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .tabs button { font:inherit; font-size:13px; border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 12px; cursor:pointer; color:var(--sub); }
  .tabs button.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  .stage-title { font-size:22px; color:var(--navy); margin:4px 0 8px; }
  .say { font-size:17px; margin:0 0 12px; }
  .show { font-size:15px; background:#faf7f0; border:1px solid #eadfc8; border-radius:10px; padding:10px 12px; margin:0 0 12px; }
  .ask { font-size:14px; color:var(--navy); background:#eef2f8; border-radius:10px; padding:8px 12px; margin:0 0 12px; }
  .ask::before { content:"お客様に聞く："; font-weight:700; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin:10px 0; }
  .kpi { border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:#fff; }
  .kpi span { font-size:12px; color:var(--sub); display:block; }
  .kpi b { font-size:22px; font-variant-numeric:tabular-nums; }
  .kpi.rent b { color:var(--rent); } .kpi.own b { color:var(--own); }
  .legend { display:flex; gap:16px; font-size:12px; color:var(--sub); margin:4px 0; }
  .legend i { display:inline-block; width:14px; height:3px; vertical-align:middle; margin-right:5px; }
  svg text { font-family:inherit; }
  .nav { display:flex; justify-content:space-between; margin-top:12px; }
  .nav button, .tools button { font:inherit; font-size:14px; border:1px solid var(--navy); background:#fff; color:var(--navy); border-radius:8px; padding:8px 16px; cursor:pointer; }
  .nav button.primary { background:var(--navy); color:#fff; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .notes { font-size:11px; color:var(--sub); margin-top:14px; }
  .notes li { margin:2px 0; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:right; }
  th:first-child, td:first-child { text-align:left; }
  /* 画面共有モード（Zoom・Teams・大型モニター）：入力を隠し、文字を大きく、1画面に収める */
  body.present header { padding:10px 24px; }
  body.present header p { display:none; }
  body.present main { grid-template-columns:1fr; max-width:none; padding:14px 28px 90px; }
  body.present .form, body.present .tools, body.present .nav { display:none; }
  body.present .panel { border:none; background:transparent; padding:0; }
  body.present .tabs button { font-size:18px; padding:8px 18px; }
  body.present .stage-title { font-size:36px; margin:6px 0 10px; }
  body.present .say { font-size:22px; margin-bottom:8px; }
  body.present .show { font-size:20px; }
  body.present .ask { font-size:20px; }
  body.present .ask::before { content:"考えてみましょう："; }
  body.present .kpi b { font-size:30px; }
  body.present .kpi span { font-size:15px; }
  body.present table { font-size:17px; }
  body.present .bd { font-size:15px; }
  body.present .bd th, body.present .bd td { padding:3px 8px; }
  body.present .kpis.dup { display:none; } /* 表の合計・控除と同じ数字なので画面共有では省く */
  body.present .small { font-size:13px; }
  body.present svg { max-height:28vh; }
  body.present .show { display:none; } /* 画面ではグラフ・カードが同じ数字を見せる（印刷・通常表示では出す） */
  body.present .kpis { margin:6px 0; }
  body.present .kpi { padding:6px 12px; }
  body.present .show, body.present .ask { margin-bottom:8px; padding:8px 12px; }
  body.present .notes { font-size:12px; }
  .pbar { display:none; }
  body.present .pbar { display:flex; position:fixed; left:0; right:0; bottom:0; gap:12px; align-items:center; justify-content:space-between;
    padding:10px 24px; background:rgba(31,42,68,.96); color:#fff; z-index:5; }
  .pbar button { font:inherit; font-size:16px; border:1px solid rgba(255,255,255,.6); background:transparent; color:#fff; border-radius:8px; padding:8px 18px; cursor:pointer; }
  .pbar button.primary { background:#b08d57; border-color:#b08d57; }
  .pbar .count { font-size:18px; letter-spacing:.1em; }
  .pbar .hint { font-size:12px; opacity:.7; }
  .toast { position:fixed; left:50%; top:16px; transform:translateX(-50%); background:#1f2a44; color:#fff; padding:10px 18px; border-radius:8px; font-size:14px; z-index:9; display:none; }
  /* 提案書（A4・4ページ） */
  #proposal { display:none; }
  .sheet { width:210mm; min-height:297mm; padding:14mm 14mm 12mm; background:#fff; margin:0 auto 12px; box-shadow:0 2px 10px rgba(0,0,0,.08); position:relative; font-size:12.5px; }
  .sheet h1 { font-size:26px; color:var(--navy); margin:0 0 4px; letter-spacing:.06em; }
  .sheet h2 { font-size:18px; color:var(--navy); margin:0 0 6px; border-left:5px solid var(--gold); padding-left:8px; }
  .sheet .lead { font-size:14px; margin:0 0 10px; }
  .sheet ul.pts { margin:0 0 10px; padding-left:1.2em; } .sheet ul.pts li { margin:3px 0; }
  .sheet .meta { display:flex; justify-content:space-between; font-size:12px; color:var(--sub); border-bottom:2px solid var(--navy); padding-bottom:6px; margin-bottom:10px; }
  .sheet .to { font-size:20px; font-weight:700; margin:10px 0 2px; }
  .sheet .foot { position:absolute; left:14mm; right:14mm; bottom:8mm; font-size:10px; color:var(--sub); display:flex; justify-content:space-between; border-top:1px solid var(--line); padding-top:4px; }
  .sheet .check li { list-style:none; margin:5px 0; font-size:13.5px; } .sheet .check { padding-left:0; }
  .sheet .check li::before { content:"☐ "; font-size:16px; }
  .sheet .notes2 { font-size:10px; color:var(--sub); padding-left:1.1em; }
  .sheet table { font-size:12px; }
  body.proposal-view main, body.proposal-view .pbar { display:none; }
  body.proposal-view #proposal { display:block; padding:14px 0; }
  .ptools { display:none; }
  body.proposal-view .ptools { display:flex; gap:8px; justify-content:center; padding:10px; position:sticky; top:0; background:var(--bg); z-index:3; }
  .ptools button { font:inherit; font-size:14px; border:1px solid var(--navy); background:#fff; color:var(--navy); border-radius:8px; padding:8px 16px; cursor:pointer; }
  .ptools button.primary { background:var(--navy); color:#fff; }
  .form input[type=text] { font:inherit; font-size:13px; padding:5px 6px; border:1px solid #c9b48a; border-radius:7px; background:#fff; width:150px; }

  /* ───── トップページ（LIFE ROUTE・お客様が主人公） ───── */
  #home { display:none; }
  body.home-view header, body.home-view main, body.home-view .pbar { display:none !important; }
  body.home-view { background:#071229; }
  body.home-view #home { display:block; min-height:100vh; color:#eef2fa;
    background:radial-gradient(1200px 600px at 60% -10%, #1d3f78 0%, rgba(7,18,41,0) 60%), linear-gradient(#0a1a3a, #071229 60%); }
  .gold { background:linear-gradient(180deg,#fff3c4 0%,#f2cd73 45%,#b98a2e 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hh { display:flex; align-items:center; gap:18px; padding:14px 22px; flex-wrap:wrap; }
  .hh .logo { display:flex; align-items:center; gap:10px; min-width:230px; }
  .hh .logo b { font-size:17px; letter-spacing:.04em; color:#fff; } .hh .logo small { display:block; font-size:10px; letter-spacing:.3em; color:#d9b968; }
  .hh .ttl { flex:1; min-width:280px; }
  .hh .ttl h1 { margin:0; font-size:44px; line-height:1.1; letter-spacing:.06em; font-weight:800; }
  .hh .ttl h1 .kana { font-size:15px; letter-spacing:.3em; margin-left:14px; color:#d9b968; -webkit-text-fill-color:#d9b968; font-weight:600; vertical-align:middle; }
  .hh .ttl p { margin:2px 0 0; font-size:14px; letter-spacing:.12em; color:#dfe6f3; }
  .who { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.06); border:1px solid rgba(242,205,115,.35); border-radius:14px; padding:8px 14px; }
  .who .av { width:44px; height:44px; border-radius:50%; background:#1c2f57; border:2px solid #f2cd73; display:grid; place-items:center; }
  .who input { font:inherit; font-size:15px; font-weight:700; color:#fff; background:transparent; border:none; border-bottom:1px dashed rgba(255,255,255,.35); width:150px; padding:0 0 2px; }
  .who input::placeholder { color:rgba(255,255,255,.55); font-weight:400; }
  .who .lv { font-size:13px; color:#f2cd73; font-weight:700; }
  .hgrid { display:grid; grid-template-columns:210px minmax(0,1fr) 330px; gap:14px; padding:0 18px 18px; }
  @media (max-width:1180px){ .hgrid { grid-template-columns:1fr; } .hgrid > div:nth-child(2) { order:-1; } .hh .ttl h1 { font-size:34px; } }
  .glass { background:linear-gradient(180deg, rgba(20,34,66,.88), rgba(10,20,44,.88)); border:1px solid rgba(242,205,115,.28); border-radius:14px; box-shadow:0 6px 24px rgba(0,0,0,.35); }
  .hnav { padding:8px; display:flex; flex-direction:column; gap:2px; }
  .hnav button { display:flex; align-items:center; gap:10px; font:inherit; font-size:14px; color:#e8edf7; background:transparent; border:1px solid transparent; border-radius:10px; padding:9px 10px; text-align:left; cursor:pointer; }
  .hnav button:hover { background:rgba(255,255,255,.06); }
  .hnav button.on { border-color:#f2cd73; background:linear-gradient(90deg, rgba(242,205,115,.22), rgba(242,205,115,.04)); color:#fff; font-weight:700; }
  .hnav svg { flex:none; }
  .mis { margin-top:12px; padding:10px 12px; }
  .mis h3, .rc h3, .acts h3 { margin:0 0 8px; font-size:15px; display:flex; align-items:center; gap:8px; }
  .mis h3 .n { margin-left:auto; background:#e5484d; color:#fff; border-radius:999px; font-size:12px; padding:0 8px; }
  .mis label { display:flex; gap:8px; align-items:flex-start; grid-template-columns:none; font-size:12.5px; margin:6px 0; color:#e3e9f4; cursor:pointer; line-height:1.45; }
  .mis label.auto { cursor:default; opacity:.9; }
  .mis input { accent-color:#d9b968; margin-top:2px; }
  .mis .d { text-decoration:line-through; text-decoration-color:rgba(242,205,115,.7); color:#b9c3d6; }
  .map { position:relative; border-radius:16px; overflow:hidden; aspect-ratio:16/10; min-height:420px; border:1px solid rgba(242,205,115,.28); }
  .map > svg { position:absolute; inset:0; width:100%; height:100%; }
  .area { position:absolute; width:21%; padding:8px 10px 9px; cursor:pointer; text-align:left; font:inherit; color:#fff;
    background:linear-gradient(180deg, rgba(14,24,48,.92), rgba(8,16,34,.92)); border:1px solid #d9b968; border-radius:12px; box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 0 18px rgba(242,205,115,.25); }
  .area:hover { transform:translateY(-2px); box-shadow:0 0 24px rgba(242,205,115,.5); }
  .area .t { display:flex; align-items:center; gap:8px; font-size:15px; white-space:nowrap; font-weight:800; letter-spacing:.04em; }
  .area .s { font-size:11.5px; color:#cfd8e8; margin:1px 0 4px 34px; }
  .area .v { font-size:11px; color:#e9edf5; line-height:1.4; margin-top:4px; }
  .area .lvrow { display:flex; align-items:center; gap:6px; font-size:11px; color:#f2cd73; font-weight:700; }
  .bar { flex:1; height:7px; background:rgba(255,255,255,.12); border-radius:9px; overflow:hidden; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#b98a2e,#f6d98a); border-radius:9px; }
  .bar.blue i { background:linear-gradient(90deg,#2d6be0,#7fb2ff); }
  .map > svg.hero { position:absolute; inset:auto; left:27%; bottom:0; width:15%; max-width:170px; height:auto; pointer-events:none; }
  .flag { position:absolute; left:26%; bottom:31%; background:rgba(8,16,34,.9); border:1px solid #f2cd73; color:#fff; border-radius:10px; padding:4px 10px; font-size:13px; font-weight:700; }
  .nextbtn { position:absolute; right:2.5%; bottom:4%; font:inherit; font-size:18px; font-weight:800; letter-spacing:.06em; color:#fff; cursor:pointer;
    padding:12px 30px; border-radius:999px; border:2px solid #f2cd73; background:linear-gradient(180deg, rgba(40,30,8,.9), rgba(12,10,4,.95)); box-shadow:0 0 22px rgba(242,205,115,.55); }
  .pin { position:absolute; transform:translate(-50%,-100%); font-size:12px; font-weight:800; color:#2a1d02; background:linear-gradient(#ffe79a,#d9a93a); border-radius:6px; padding:2px 8px; box-shadow:0 0 12px rgba(242,205,115,.8); }
  .acts { margin-top:12px; padding:12px; }
  .acts .row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  @media (max-width:820px){
    .acts .row { grid-template-columns:1fr 1fr; }
    .map { aspect-ratio:auto; min-height:0; display:flex; flex-wrap:wrap; gap:8px; padding:10px; }
    .area { position:relative; left:auto !important; top:auto !important; width:calc(50% - 4px); }
    .area .t { font-size:13px; white-space:normal; } .area .s { margin-left:0; }
    .hero, .flag, .pin { display:none; }
    .mdetail { position:relative; left:auto; bottom:auto; width:100%; }
    .nextbtn { position:relative; right:auto; bottom:auto; width:100%; margin-top:4px; }
    .hh .ttl h1 { font-size:30px; } .hh .logo { min-width:0; } .hgrid { padding:0 10px 14px; } .hh { padding:12px 12px; }
    .who input { width:120px; }
    .hnav { display:grid; grid-template-columns:1fr 1fr; } .hnav button { font-size:12.5px; padding:7px 8px; }
    .rc li { grid-template-columns:16px 1fr 40px 84px; }
  }
  .act { position:relative; min-height:118px; border-radius:12px; overflow:hidden; cursor:pointer; text-align:left; font:inherit; color:#fff; border:1px solid rgba(242,205,115,.35); padding:10px 12px; }
  .act b { font-size:16px; display:block; } .act span { font-size:12px; color:#e8edf5; }
  .act em { position:absolute; right:10px; bottom:10px; font-style:normal; font-size:12px; border:1px solid #f2cd73; border-radius:999px; padding:3px 12px; background:rgba(0,0,0,.45); }
  .act svg { position:absolute; right:-6px; top:-6px; opacity:.55; }
  .rc { padding:12px 14px; margin-bottom:12px; }
  .rc .big { font-size:30px; font-weight:800; letter-spacing:.02em; }
  .rc .big small { font-size:15px; margin-left:2px; }
  .rc .sub { font-size:12px; color:#9fb0cc; }
  .rc ul { list-style:none; margin:8px 0 0; padding:0; }
  .rc li { display:grid; grid-template-columns:16px 1fr 46px 92px; gap:6px; align-items:center; font-size:13px; padding:5px 0; border-top:1px solid rgba(255,255,255,.07); }
  .rc li .dot { width:11px; height:11px; border-radius:50%; } .rc li .r { text-align:right; }
  .ring { display:flex; gap:12px; align-items:center; }
  .ev { list-style:none; margin:0; padding:0 0 0 4px; }
  .ev li { display:grid; grid-template-columns:14px 52px 1fr; gap:6px; align-items:center; font-size:13.5px; padding:6px 0; border-top:1px solid rgba(255,255,255,.07); }
  .ev li::before { content:""; width:9px; height:9px; border-radius:50%; background:#f2cd73; box-shadow:0 0 8px #f2cd73; }
  .ev li.now::before { background:#7fb2ff; box-shadow:0 0 8px #7fb2ff; }
  .area .bg { margin-top:4px; line-height:1.2; }
  .area .bg b { display:block; font-size:24px; color:#ffe39a; letter-spacing:.01em; }
  .area .bg span { font-size:11.5px; color:#cfd8e8; }
  .area .v { color:#b8c4d8; }
  .ms { cursor:pointer; } .ms circle { transition:all .15s; }
  .ms.hl circle { fill:#f2cd73; } .ms.hl text:first-of-type { fill:#2a1d02; } .ms.hl rect { fill:rgba(60,44,8,.95); stroke:#ffe39a; stroke-width:2; }
  .sdot { cursor:pointer; } .sdot.hl circle { r:8; fill:#ffe39a; } .sdot.hl line { stroke-opacity:1; }
  .ev li { cursor:pointer; border-radius:8px; } .ev li.hl { background:rgba(242,205,115,.14); }
  .ev li small { display:block; font-size:11.5px; color:#9fb0cc; }
  .mdetail { position:absolute; left:2%; bottom:3%; width:23%; background:rgba(8,16,34,.9); border:1px solid #f2cd73; border-radius:12px; padding:8px 12px; font-size:13px; display:flex; flex-direction:column; gap:2px; box-shadow:0 0 18px rgba(242,205,115,.35); }
  .mdetail b { font-size:15px; color:#ffe39a; } .mdetail .as { font-size:12px; color:#9fd0ff; }
  @media (max-width:820px){ /* スマホ：地図はカードを並べるだけ。道の印の数字は下の「ライフイベント」と詳しい欄で見せる */
    .mdetail { position:relative; left:auto; bottom:auto; width:100%; order:9; }
    #ms { display:none; }
  }
  .hnote { font-size:11px; color:#9fb0cc; padding:0 22px 18px; }
  .tabs button.home { font-weight:700; }
  @media print {
    body.proposal-view header, body.proposal-view .ptools { display:none !important; }
    body.proposal-view #proposal { padding:0; }
    body.proposal-view .sheet { box-shadow:none; margin:0; page-break-after:always; break-after:page; height:297mm; overflow:hidden; }
    @page { size:A4; margin:0; }
  }
  @media print {
    header, .form, .tabs, .nav, .tools, .pbar, .toast { display:none !important; }
    main { display:block; padding:0; } body { background:#fff; } .panel { border:none; padding:0; }
    .step { display:block !important; break-inside:avoid; margin-bottom:18px; }
  }
</style>
</head>
<body>
<section id="home"></section>
<header>
  <h1>LIFE ROUTE <small style="font-size:13px;font-weight:400;opacity:.85">ライフルート</small></h1>
  <p>独身の方にも、結婚・子育ての方にも。賃貸のまま／持ち家 を、今から95歳まで同じ物差しで。どのお客様にも ⓪〜⑦ の同じ順番で説明します（概算・通信なし・保存なし）</p>
</header>
<main>
  <section class="panel form" id="form"></section>
  <section class="panel">
    <div class="tabs" id="tabs"></div>
    <div id="steps"></div>
    <div class="nav"><button id="prev">← 前へ</button><button class="primary" id="next">次へ →</button></div>
    <div class="tools"><button id="toHome" style="background:#b08d57;color:#fff;border-color:#b08d57">★ トップ（LIFE ROUTE）</button><button id="present" class="primary" style="background:#1f2a44;color:#fff">画面共有モード（Zoom）</button><button id="link">共有リンクをコピー</button><button id="prop" style="background:#b08d57;color:#fff;border-color:#b08d57">提案書（A4・PDF）</button><button id="all">全部を1ページで見る（印刷用）</button><button id="print">印刷・PDF</button></div>
    <ul class="notes" id="notes"></ul>
  </section>
</main>

<div class="pbar"><button id="pExit">条件を変える</button><span><button id="pPrev">← 前へ</button> <span class="count" id="pCount"></span> <button class="primary" id="pNext">次へ →</button></span><span><button id="pFull">全画面</button> <span class="hint">← → キーでも移動</span></span></div>
<div class="toast" id="toast"></div>
<script>
// LIFE ROUTE（ライフルート）の計算：賃貸のまま／持ち家 を、今から95歳まで同じ前提で比べる
// 依存なし。Node：require("./lib/engine")　ブラウザ：<script src="lib/engine.js"> で window.LHS
(function (root, factory) {
  const m = factory();
  if (typeof module === "object" && module.exports) module.exports = m;
  else root.LHS = m;
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  // お客様に言わない表現（事実に反する・断定・あおり）
  // 一般の年収：国税庁「民間給与実態統計調査」令和5年分の平均給与（1年を通じて勤務した給与所得者）
  const AVG_SALARY = 4_595_000;

  const FORBIDDEN = [/今しかない/, /二度と(買えない|ない)/, /必ず値上がり/, /絶対に損(し|は)ない/, /今買わないと損/, /家賃は(無駄|捨て)/, /返済(は|が)(すべて|全部)資産/, /必ず売れる/, /土地は必ず/, /残りわずか/, /今だけ/];

  // 年金の概算に使う数字（令和8年度。日本年金機構の資料による。毎年度改定）
  const PENSION = {
    basicFull: 847_300,        // 老齢基礎年金の満額（年額）
    kouseiRate: 5.481 / 1000,  // 厚生年金（報酬比例部分）の乗率（2003年4月以降の加入期間）
    salaryCap: 650_000,        // 標準報酬月額の上限
  };

  // 住宅ローン控除（2026〜2027年入居の制度。単身・一般は limit[0]、子育て・若者夫婦世帯は limit[1]）
  // 2028年以降の入居は新築の省エネ基準などが変わる〔要確認〕。詳しい判定は land-life-proposal/lib/rules.js
  const CREDIT_KINDS = {
    new_cert: { label: "新築・買取再販（認定長期優良・低炭素）", limit: [45_000_000, 50_000_000], years: 13 },
    new_zeh: { label: "新築・買取再販（ZEH水準省エネ）", limit: [35_000_000, 45_000_000], years: 13 },
    new_energy: { label: "新築・買取再販（省エネ基準）", limit: [20_000_000, 30_000_000], years: 13 },
    used_zeh: { label: "中古（認定・ZEH水準）", limit: [35_000_000, 45_000_000], years: 13 },
    used_energy: { label: "中古（省エネ基準）", limit: [20_000_000, 30_000_000], years: 13 },
    used_other: { label: "中古・買取再販（その他の住宅）", limit: [20_000_000, 20_000_000], years: 10 },
    none: { label: "対象外（省エネ基準を満たさない新築など）", limit: [0, 0], years: 0 },
  };
  const CREDIT_RATE = 0.007, RES_CAP_RATE = 0.05, RES_CAP_MAX = 97_500;

  // 税額の概算（給与収入だけ・単身。令和8・9年分の特例を将来も続くと仮定＝控除できる余地を低めに見積もる）
  function salaryDeduction(g) {
    let f;
    if (g <= 1_625_000) f = 550_000;
    else if (g <= 1_800_000) f = g * 0.4 - 100_000;
    else if (g <= 3_600_000) f = g * 0.3 + 80_000;
    else if (g <= 6_600_000) f = g * 0.2 + 440_000;
    else if (g <= 8_500_000) f = g * 0.1 + 1_100_000;
    else f = 1_950_000;
    return Math.min(g, Math.max(740_000, f));
  }
  function basicDeduction(total) {
    if (total > 25_000_000) return 0;
    if (total > 24_500_000) return 160_000;
    if (total > 24_000_000) return 320_000;
    if (total > 23_500_000) return 480_000;
    if (total <= 4_890_000) return 1_040_000;
    if (total <= 6_550_000) return 670_000;
    return 620_000;
  }
  function incomeTaxOf(t) {
    const B = [[1_950_000, 0.05, 0], [3_300_000, 0.1, 97_500], [6_950_000, 0.2, 427_500], [9_000_000, 0.23, 636_000],
      [18_000_000, 0.33, 1_536_000], [40_000_000, 0.4, 2_796_000], [Infinity, 0.45, 4_796_000]];
    const b = B.find((x) => t <= x[0]);
    return Math.max(0, Math.floor(t * b[1] - b[2]));
  }
  function estimateTax(gross, socialRate = 0.15) {
    const totalIncome = Math.max(0, gross - salaryDeduction(gross));
    const social = gross * socialRate;
    const taxable = Math.floor(Math.max(0, totalIncome - social - basicDeduction(totalIncome)) / 1000) * 1000;
    const rtTaxable = Math.floor(Math.max(0, totalIncome - social - 430_000) / 1000) * 1000;
    const residentTax = Math.max(0, Math.floor(rtTaxable * 0.1 - 2_500));
    return { totalIncome, taxable, incomeTax: incomeTaxOf(taxable), residentTax };
  }

  const man = (v, d = 0) => (v == null ? "—" : (v / 10_000).toLocaleString("ja-JP", { minimumFractionDigits: d, maximumFractionDigits: d }) + "万円");
  const manY = (v) => man(v, v % 10_000 ? 1 : 0); // 2万円・5.8万円

  function payment(P, rate, years) {
    if (P <= 0) return 0;
    const r = rate / 12, n = years * 12;
    if (r === 0) return P / n;
    const g = Math.pow(1 + r, n);
    return (P * r * g) / (g - 1);
  }
  function balanceAfter(P, rate, years, months) {
    const r = rate / 12, pm = payment(P, rate, years), k = Math.min(months, years * 12);
    if (r === 0) return Math.max(0, P - pm * k);
    const g = Math.pow(1 + r, k);
    return Math.max(0, P * g - (pm * (g - 1)) / r);
  }

  // 年金の概算（年額）：基礎年金（満額と仮定）＋厚生年金（月給 × 乗率 × 加入月数）
  // reemploy＝{ age: 定年, rate: 再雇用の年収の割合 }：定年から retireAge までは月給が rate 倍
  function pension(income, workStart, retireAge, reemploy) {
    const mon = (v) => Math.min(PENSION.salaryCap, Math.max(0, v) / 12);
    const re = reemploy ? Math.min(retireAge, Math.max(workStart, reemploy.age)) : retireAge;
    const rRate = reemploy ? reemploy.rate : 1;
    const months1 = Math.max(0, re - workStart) * 12, months2 = Math.max(0, retireAge - re) * 12;
    const kousei = income > 0 ? (mon(income) * months1 + mon(income * rRate) * months2) * PENSION.kouseiRate : 0;
    const yearly = Math.round(PENSION.basicFull + kousei);
    return { yearly, monthly: yearly / 12, basic: PENSION.basicFull, kousei: Math.round(kousei) };
  }

  // 名前（トップページ・提案書・画面で同じ）
  const APP = { name: "LIFE ROUTE", kana: "ライフルート", tagline: "住まいとお金、95歳までの道のり" };

  // 会社名の初期値（トップページ・提案書。画面の「会社名」で変えられる）
  const DEFAULT_COMPANY = "合同会社ジャパンマネジメント";

  // 家賃の平均：当社のお客様の家賃の中央値（社内Slack #02_アポ報告 見込み客の集計 2026年9〜10月）。社宅・家賃補助の自己負担は1〜3万円が多い
  const RENT_AVG = { single: 58_000, shatakuSelf: 20_000, source: "当社のお客様（20代後半・単身・賃貸）の家賃の中央値 約5.8万円、社宅・家賃補助の自己負担 1〜3万円（2026年9〜10月の商談・アポ報告の集計）" };

  // 商談報告（#03）の中央値に近いお客様像：27歳・年収390万・貯金140万。家賃は将来の暮らしに合わせた目安（仮定）
  // お客様像のひな形。初期値は「独身」（商談のお客様の大半：独身・結婚願望「無し・あまり無し」71%）
  function preset(name) {
    const p = {
      age: 27, income: 3_900_000, savings: 1_400_000, workStart: 22, retireAge: 65, lifeEnd: 95,
      family: { marryAge: null, kids: 0, firstKidAge: 32 },
      partnerIncome: 0,
      rent: { single: RENT_AVG.single, couple: 75_000, family: 90_000, old: RENT_AVG.single, renewMonths: 1, renewEvery: 2, insYear: 10_000 },
      shataku: { on: false, self: RENT_AVG.shatakuSelf, until: 30 },
      reemploy: { age: 60, rate: 0.6 }, // 60歳で定年→65歳まで再雇用（年収は定年前の6割と仮定） // 社宅：自己負担と、出なければいけない年齢（だいたい30歳）
      own: { buyAge: 30, price: 28_000_000, landShare: 0.35, down: 0, costRate: 0.07, financeCosts: true, rate: 0.012, years: 35,
        propTax: 100_000, ins: 30_000, repairYear: 150_000, repairUpAfter: 20, repairUpRate: 1.5, kind: "used_other" },
      lifeIns: { monthly: 10_000, cutWithDanshin: 0 },
      nisa: { monthly: 10_000, balance: 300_000, rate: 0.03 },
      raise: 0.01, // 年収の上がり方（年率・仮定）
      oldLiving: { single: 130_000, couple: 220_000 },
      landRates: { down: -0.01, flat: 0, up: 0.01 },
      invest: { on: false, rate: 0.03 },
    };
    if (name === "family") { p.family = { marryAge: 30, kids: 1, firstKidAge: 32 }; p.rent.old = 70_000; }
    if (name === "shataku") { p.shataku.on = true; p.own.buyAge = p.shataku.until; }
    return p;
  }
  const PRESETS = { single: "独身・賃貸（家賃は平均）", shataku: "独身・社宅（30歳ごろまで）", family: "結婚・子どもあり" };
  function defaults() { return preset("single"); }

  function stage(inp, age) {
    const f = inp.family || {};
    if (age >= inp.retireAge) return "old";
    if (f.kids > 0 && f.firstKidAge != null && age >= f.firstKidAge && age < f.firstKidAge + 22) return "family";
    if (f.marryAge != null && age >= f.marryAge) return "couple";
    return "single";
  }
  const STAGE_LABEL = { single: "ひとり暮らし", couple: "2人暮らし", family: "子育て", old: "老後", shataku: "社宅" };

  function compute(input, nested) {
    const d = defaults();
    const inp = { ...d, ...input, family: { ...d.family, ...(input.family || {}) }, rent: { ...d.rent, ...(input.rent || {}) },
      own: { ...d.own, ...(input.own || {}) }, oldLiving: { ...d.oldLiving, ...(input.oldLiving || {}) },
      landRates: { ...d.landRates, ...(input.landRates || {}) }, invest: { ...d.invest, ...(input.invest || {}) },
      lifeIns: { ...d.lifeIns, ...(input.lifeIns || {}) }, nisa: { ...d.nisa, ...(input.nisa || {}) }, shataku: { ...d.shataku, ...(input.shataku || {}) }, reemploy: { ...d.reemploy, ...(input.reemploy || {}) } };
    const reAge = Math.min(inp.retireAge, inp.reemploy.age), reRate = inp.reemploy.rate;
    const sh = inp.shataku;
    const inShataku = (age) => sh.on && age < sh.until && age < inp.retireAge;
    const o = inp.own, R = inp.rent;
    const married = inp.family.marryAge != null;
    const cost = o.price * o.costRate;
    const loan = o.price - o.down + (o.financeCosts ? cost : 0);
    const cashAtBuy = o.down + (o.financeCosts ? 0 : cost);
    const pmt = payment(loan, o.rate, o.years);
    const buyAge = Math.max(inp.age, o.buyAge);
    const loanEnd = buyAge + o.years;

    const me = pension(inp.income, inp.workStart, inp.retireAge, inp.reemploy);
    const partner = married ? (inp.partnerIncome > 0 ? pension(inp.partnerIncome, inp.workStart, inp.retireAge, inp.reemploy) : { yearly: PENSION.basicFull }) : { yearly: 0 };
    const pensionYearly = me.yearly + partner.yearly;
    const living = married ? inp.oldLiving.couple : inp.oldLiving.single;

    // 住宅ローン控除：年末残高（住宅の取得分だけ）× 0.7%（限度額・物件価格まで）。所得税→住民税（課税所得×5%・最高97,500円）の順に、払った税金の範囲で戻る
    const kind = CREDIT_KINDS[o.kind] || CREDIT_KINDS.none;
    const f = inp.family;
    const marriedAtBuy = f.marryAge != null && f.marryAge <= buyAge;
    const kidAtBuy = f.kids > 0 && f.firstKidAge != null && f.firstKidAge <= buyAge && buyAge - f.firstKidAge < 19; // 19歳未満の子がいる
    // 上乗せの対象世帯で、かつ限度額が上がる住宅のときだけ「上乗せ」として扱う
    const special = ((marriedAtBuy && buyAge < 40) || kidAtBuy) && kind.limit[1] > kind.limit[0];
    const limit = kind.limit[special ? 1 : 0];
    const tax = estimateTax(inp.income);
    const resCap = Math.min(RES_CAP_MAX, Math.floor(tax.taxable * RES_CAP_RATE), tax.residentTax);
    const share = loan > 0 ? Math.min(1, Math.max(0, o.price - o.down) / loan) : 0;
    const creditRows = [];
    for (let i = 1; i <= kind.years && buyAge + i - 1 < inp.lifeEnd; i++) {
      const balance = balanceAfter(loan, o.rate, o.years, 12 * i) * share;
      const max = Math.floor((Math.min(balance, limit, o.price) * CREDIT_RATE) / 100) * 100;
      const fromIT = Math.min(max, tax.incomeTax);
      const fromRT = Math.min(max - fromIT, resCap);
      creditRows.push({ i, age: buyAge + i - 1, balance, max, fromIT, fromRT, actual: fromIT + fromRT });
    }
    // その年齢になった時点で、返した回数・残りの回数・残高（ローンは月で数える：35年＝420回）
    const loanAt = (age) => {
      const paidN = Math.min(o.years * 12, Math.max(0, age - buyAge) * 12);
      return { age, paid: paidN, left: o.years * 12 - paidN, balance: balanceAfter(loan, o.rate, o.years, paidN) };
    };
    const creditAt = (age) => (creditRows.find((r) => r.age === age) || { actual: 0 }).actual;

    const years = [];
    for (let age = inp.age; age < inp.lifeEnd; age++) {
      const st = inShataku(age) ? "shataku" : stage(inp, age);
      const rentMonthly = st === "shataku" ? sh.self : R[st];
      const rentPart = rentMonthly * 12, renewPart = st === "shataku" ? 0 : (rentMonthly * R.renewMonths) / R.renewEvery, rentIns = R.insYear;
      const rentYear = rentPart + renewPart + rentIns;
      let ownYear, ownLoan = 0, ownUpkeep = 0, cash = 0, ownTax = 0, ownIns = 0, ownRepair = 0, ownCredit = 0, preRent = 0;
      if (age < buyAge) { ownYear = rentYear; preRent = rentYear; }
      else {
        if (age === buyAge) cash = cashAtBuy;
        ownLoan = age < loanEnd ? pmt * 12 : 0;
        const held = age - buyAge;
        ownTax = o.propTax; ownIns = o.ins; ownRepair = o.repairYear * (held >= o.repairUpAfter ? o.repairUpRate : 1);
        ownUpkeep = ownTax + ownIns + ownRepair;
        ownCredit = creditAt(age);
        ownYear = cash + ownLoan + ownUpkeep - ownCredit;
      }
      years.push({ age, stage: st, stageLabel: STAGE_LABEL[st], rentMonthly, rentYear, rentPart, renewPart, rentIns,
        ownYear, ownLoan, ownUpkeep, ownTax, ownIns, ownRepair, ownCredit, cash, preRent });
    }

    const sum = (arr, k) => arr.reduce((s, y) => s + y[k], 0);
    const oldYears = years.filter((y) => y.age >= inp.retireAge);
    const oldOf = (k, housingK) => {
      const out = oldYears.map((y) => living * 12 + y[housingK]);
      const gaps = out.map((v) => Math.max(0, v - pensionYearly));
      const need = gaps.reduce((s, v) => s + v, 0);
      return { housingTotal: sum(oldYears, housingK), need, gapMonthly: oldYears.length ? need / oldYears.length / 12 : 0,
        outMonthly: oldYears.length ? out.reduce((s, v) => s + v, 0) / oldYears.length / 12 : 0 };
    };
    const oldRent = { ...oldOf("rent", "rentYear"), rentTotal: sum(oldYears, "rentYear") };
    const oldOwn = oldOf("own", "ownYear");
    const monthsToRetire = Math.max(1, (inp.retireAge - inp.age) * 12);

    // 65歳時点の家の価値（土地は年率で変化、建物は30年で1割まで直線で下がると仮定）
    const t = Math.max(0, inp.retireAge - buyAge);
    const bldg = o.price * (1 - o.landShare) * Math.max(0.1, 1 - (0.9 * t) / 30);
    const landAt = (r) => o.price * o.landShare * Math.pow(1 + r, t);
    const balance65 = balanceAfter(loan, o.rate, o.years, t * 12);
    const value65 = { down: landAt(inp.landRates.down) + bldg, flat: landAt(inp.landRates.flat) + bldg, up: landAt(inp.landRates.up) + bldg, bldg, balance: balance65 };

    // 公平な比較：賃貸の人が「持ち家との差額」を毎年積み立てて運用した場合の65歳時点の額（運用は元本保証なし）
    let fv = 0;
    for (const y of years.filter((y) => y.age >= buyAge && y.age < inp.retireAge)) fv = fv * (1 + inp.invest.rate) + Math.max(0, y.ownYear - y.rentYear);

    const tot = (k) => years.reduce((s2, y) => s2 + y[k], 0);
    const paid = tot("ownLoan");
    const paidMonths = 12 * Math.max(0, Math.min(loanEnd, inp.lifeEnd) - buyAge);
    const principal = paid > 0 ? loan - balanceAfter(loan, o.rate, o.years, paidMonths) : 0;
    const breakdown = {
      rent: {
        rent: { label: "家賃", amount: tot("rentPart") },
        renew: { label: "更新料", amount: tot("renewPart") },
        ins: { label: "家財保険（賃貸の火災保険）", amount: tot("rentIns") },
      },
      own: {
        preRent: { label: "買うまでの家賃など", amount: tot("preRent") },
        cash: { label: "頭金・諸費用（現金）", amount: tot("cash") },
        principal: { label: o.financeCosts ? "ローン返済のうち元金（諸費用を含む）" : "ローン返済のうち元金", amount: principal },
        interest: { label: "ローン返済のうち利息", amount: paid - principal },
        tax: { label: "固定資産税・都市計画税", amount: tot("ownTax") },
        ins: { label: "火災・地震保険", amount: tot("ownIns") },
        repair: { label: "修繕の積立", amount: tot("ownRepair") },
        credit: { label: "住宅ローン控除（戻る税金）", amount: tot("ownCredit"), sign: -1 },
      },
    };
    // 生命保険（住まいとは別に、両方で払う）。持ち家は団信で死亡保障が付くので、見直せる分を設定できる
    const lifeYears = Math.max(0, inp.retireAge - inp.age);
    const ownedYears = Math.max(0, Math.min(inp.retireAge, loanEnd) - buyAge); // 団信が付いている（返している）年数
    const insurance = {
      rentHome: breakdown.rent.ins.amount, ownHome: breakdown.own.ins.amount,
      rentLife: inp.lifeIns.monthly * 12 * lifeYears,
      ownLife: inp.lifeIns.monthly * 12 * lifeYears - Math.min(inp.lifeIns.cutWithDanshin, inp.lifeIns.monthly) * 12 * ownedYears,
      lifeMonthly: inp.lifeIns.monthly, cut: inp.lifeIns.cutWithDanshin,
    };

    // 生涯収入（これからの給料＋年金）と、そのうち住まいに使う割合
    let salaryMe = 0, salaryPartner = 0, salaryReemploy = 0;
    for (let a = inp.age; a < inp.retireAge; a++) {
      // 定年までは毎年 raise で上がり、再雇用の間は定年前の年収 × rate（上がらない）
      const g = Math.pow(1 + inp.raise, Math.min(a, reAge) - inp.age) * (a >= reAge ? reRate : 1);
      salaryMe += inp.income * g;
      if (a >= reAge) salaryReemploy += inp.income * g;
      if (married && a >= inp.family.marryAge) salaryPartner += inp.partnerIncome * g;
    }
    const pensionTotal = pensionYearly * oldYears.length;
    const life = { rent: sum(years, "rentYear"), own: sum(years, "ownYear") };
    const incomeTotal = salaryMe + salaryPartner + pensionTotal;
    const income = {
      salaryMe, salaryPartner, salaryReemploy, reemploy: { age: reAge, rate: reRate }, pension: pensionTotal, total: incomeTotal,
      vsAverage: inp.income / AVG_SALARY, average: AVG_SALARY, averageLifetime: AVG_SALARY * Math.max(0, inp.retireAge - inp.workStart),
      housingShare: { rent: incomeTotal ? life.rent / incomeTotal : 0, own: incomeTotal ? life.own / incomeTotal : 0 },
    };

    // ポートフォリオ：今の資産と、65歳時点の資産（預貯金は今のまま、NISAは積立＋運用と仮定）
    const n = Math.max(0, inp.retireAge - inp.age), nr = inp.nisa.rate;
    const nisa65 = inp.nisa.balance * Math.pow(1 + nr, n) + (nr === 0 ? inp.nisa.monthly * 12 * n : (inp.nisa.monthly * 12 * (Math.pow(1 + nr, n) - 1)) / nr);
    const houseNet = Math.max(0, value65.flat - value65.balance);
    const portfolio = {
      now: { savings: inp.savings, nisa: inp.nisa.balance, realEstate: 0, insuranceMonthly: inp.lifeIns.monthly, nisaMonthly: inp.nisa.monthly },
      at65: {
        nisa: nisa65,
        rent: { savings: inp.savings, nisa: nisa65, realEstate: 0, total: inp.savings + nisa65 },
        own: { savings: inp.savings, nisa: nisa65, realEstate: houseNet, total: inp.savings + nisa65 + houseNet },
      },
    };

    // 「今はいい」と思ったら：1・3・5年待った場合（返済は80歳までに終わる期間に縮める）
    let wait = [], waitRateUp = null;
    if (!nested) {
      const b0 = buyAge;
      const at = (k, rateAdd = 0) => {
        const b = b0 + k, yrs = Math.max(10, Math.min(o.years, 80 - b));
        const sub = compute({ ...input, own: { ...o, buyAge: b, years: yrs, rate: o.rate + rateAdd } }, true);
        const waited = years.filter((y) => y.age >= b0 && y.age < b);
        // 審査の目安：返済比率（毎月の返済×12÷買うときの年収）。年収400万円未満30%・以上35%（フラット35の基準）
        const incB = inp.income * Math.pow(1 + inp.raise, b - inp.age);
        const ratio = incB > 0 ? (sub.loan.pmt * 12) / incB : 0, lim = incB < 4_000_000 ? 0.3 : 0.35;
        const screen = { income: incB, ratio, limit: lim, ok: ratio <= lim, shorter: yrs < o.years };
        return { years: k, buyAge: b, loanYears: yrs, payoffAge: b + yrs, pmt: sub.loan.pmt, screen,
          rentWhileWaiting: waited.reduce((s2, y) => s2 + y.rentYear, 0), loanYearsAfterRetire: Math.max(0, b + yrs - inp.retireAge),
          lifeOwn: sub.life.own, oldGapOwn: sub.old.own.gapMonthly };
      };
      wait = [0, 1, 3, 5].map((k) => at(k));
      waitRateUp = { ...at(3, 0.005), rateAdd: 0.005 };
    }

    return {
      input: inp,
      years,
      income,
      portfolio,
      wait,
      waitRateUp,
      tax,
      renew: (() => {
        const n = years.filter((y) => y.renewPart > 0).length;
        return { total: tot("renewPart"), old: oldYears.reduce((s2, y) => s2 + y.renewPart, 0), every: R.renewEvery, months: R.renewMonths,
          times: R.renewEvery > 0 ? Math.round(n / R.renewEvery) : 0, perTimeNow: (inShataku(inp.age) ? 0 : R[stage(inp, inp.age)]) * R.renewMonths };
      })(),
      // 審査：老後の賃貸の入居審査は、収入が年金だけになる。家賃が収入の3分の1以下が一般的な目安
      screening: { rent: { ageFrom: inp.retireAge, ratioOld: pensionYearly > 0 ? (R.old * 12) / pensionYearly : Infinity, guide: 1 / 3,
        hard: pensionYearly > 0 ? (R.old * 12) / pensionYearly > 1 / 3 : true } },
      shataku: sh.on ? { self: sh.self, until: sh.until, after: R[stage(inp, Math.max(inp.age, sh.until))], jump: R[stage(inp, Math.max(inp.age, sh.until))] - sh.self } : null,
      credit: { kind: o.kind, label: kind.label, limit, years: kind.years, special, rows: creditRows, total: creditRows.reduce((s2, r) => s2 + r.actual, 0),
        totalMax: creditRows.reduce((s2, r) => s2 + r.max, 0), first: creditRows.length ? creditRows[0].actual : 0 },
      breakdown,
      insurance,
      acquisition: { cost, costRate: o.costRate },
      loan: { amount: loan, pmt, cashAtBuy, buyAge, endAge: loanEnd, months: o.years * 12,
        atReemploy: loanAt(reAge), atRetire: loanAt(inp.retireAge),
        ratioNow: inp.income > 0 ? (pmt * 12) / inp.income : 0, ratioReemploy: inp.income * reRate > 0 ? (pmt * 12) / (inp.income * reRate) : 0 },
      pension: { me, partnerYearly: partner.yearly, yearly: pensionYearly, monthly: pensionYearly / 12, living },
      life,
      old: { rent: oldRent, own: oldOwn, years: oldYears.length },
      prepare: { rentNeed: oldRent.need, ownNeed: oldOwn.need, rentExtra: oldRent.need - oldOwn.need,
        monthlyRent: oldRent.need / monthsToRetire, monthlyOwn: oldOwn.need / monthsToRetire, months: monthsToRetire },
      value65,
      whatIf: { pmt, rateUpPmt: payment(loan, o.rate + 0.01, o.years), danshinLoanAfter: 0, danshinRentContinues: married ? R.couple : R.single },
      fair: { rentInvested65: fv, rate: inp.invest.rate, note: `持ち家との差額を毎年積み立てて、年${(inp.invest.rate * 100).toFixed(0)}%で運用できた場合（運用は元本保証なし。続けられるかが前提）` },
    };
  }

  // 定年・再雇用とローンの回数（説明と提案書で同じ文を使う）
  function workLoanLine(x) {
    const i = x.input, L = x.loan, re = x.income.reemploy, r = L.atReemploy;
    const work = re.age < i.retireAge ? `${re.age}歳で定年、${i.retireAge}歳まで再雇用（年収は定年前の${Math.round(re.rate * 100)}%＝今の年収なら ${man(i.income * re.rate)}と仮定）` : `${i.retireAge}歳まで今の働き方`;
    const loan = `ローンは${i.own.years}年＝${L.months}回払い（毎月 ${man(L.pmt, 1)}）`;
    const at = re.age < i.retireAge && r.left > 0 ? `。${re.age}歳の時点で${r.paid}回払って残り${r.left}回（残高 ${man(r.balance)}）、再雇用の間の返済は年収の${Math.round(L.ratioReemploy * 100)}%${L.ratioReemploy > 0.35 ? "（重いので、定年までの繰上げ返済や退職金で残りを減らす計画も一緒に考えます）" : ""}` : r.left === 0 ? `。${re.age}歳までに完済` : "";
    const end = L.atRetire.left > 0 ? `。${i.retireAge}歳でまだ残り${L.atRetire.left}回（残高 ${man(L.atRetire.balance)}）` : `。${L.endAge}歳で完済`;
    return work + "／" + loan + at + end;
  }

  // 老後の賃貸の入居審査（一般的な目安。断定しない）
  function rentScreenLine(x) {
    const s = x.screening.rent, i = x.input;
    return `賃貸の入居審査：${s.ageFrom}歳からは収入が年金（毎月 ${man(x.pension.monthly, 1)}）だけになり、家賃 ${man(i.rent.old, 1)} は年金の${Math.round(s.ratioOld * 100)}%。家賃は収入の3分の1以内が一般的な審査の目安なので、${s.hard ? "高齢・保証人とあわせて通りにくくなる場合があります" : "目安の範囲ですが、年齢や保証人で断られる場合があります"}`;
  }

        ask: "どちらの準備なら、ご自身に合っていると思いますか。" },

  }

  // トップページ（LIFE ROUTE）：お客様が主人公。数字はすべて compute の結果から（見本の数字は使わない）
  // done＝チェックしたミッション（{ preApproval, viewHomes, nenkin, insurance, nisaReview }）。画面の中だけで、保存しない
  function home(x, done = {}, meta = {}) {
    const i = x.input, o = i.own, pf = x.portfolio, L = x.loan;
    const now = i.savings + i.nisa.balance;
    const parts = [
      { key: "realEstate", label: "不動産", amount: 0 },
      { key: "nisa", label: "NISA", amount: i.nisa.balance },
      { key: "savings", label: "預貯金", amount: i.savings },
    ].map((p) => ({ ...p, share: now > 0 ? p.amount / now : p.key === "savings" ? 1 : 0 }));
    // 今から65歳まで、持ち家の場合の資産（預貯金＋NISA＋家の価値−残りのローン）。65歳は portfolio.at65.own と同じ
    const nr = i.nisa.rate, path = [];
    for (let a = i.age; a <= i.retireAge; a++) {
      const n = a - i.age, g = Math.pow(1 + nr, n);
      const nisa = i.nisa.balance * g + (nr === 0 ? i.nisa.monthly * 12 * n : (i.nisa.monthly * 12 * (g - 1)) / nr);
      let house = 0;
      if (a >= L.buyAge) {
        const t = a - L.buyAge;
        const value = o.price * o.landShare + o.price * (1 - o.landShare) * Math.max(0.1, 1 - (0.9 * t) / 30);
        house = Math.max(0, value - balanceAfter(L.amount, o.rate, o.years, t * 12));
      }
      path.push({ age: a, own: i.savings + nisa + house, rent: i.savings + nisa });
    }
    const target = x.prepare.rentNeed;
    const rentNow = x.years[0] ? x.years[0].rentMonthly : i.rent.single;
    const M = [
      { id: "cushion", area: "cash", label: `急な出費に備える貯金（家賃の6か月分 ${man(rentNow * 6)}）`, auto: true, done: i.savings >= rentNow * 6 },

      { id: "nisaReview", area: "nisa", label: "積立の額と続けられるかを確かめる", auto: false },

    const lv = (k) => 1 + M.filter((m) => m.area === k && m.done).length;

    // big＝カードで大きく見せる数字（1つ）、bigLabel＝その数字が何か
    const area = (key, label, sub, big, bigLabel, value, step) => ({ key, label, sub, big, bigLabel, value, step, level: lv(key), progress: prog(key), missions: M.filter((m) => m.area === key) });
    const areas = [
      area("cash", "現預金エリア", "安心の土台をつくる", man(i.savings), "今の預貯金", `急な出費の備え：家賃の6か月分 ${man(rentNow * 6)}`, 0),

      area("ins", "保険エリア", "もしもの時に備える", man(i.lifeIns.monthly, 1), "毎月の保険料", "団信で万一のときローンは残らない", 5),
      area("home", "不動産エリア", "住まいで人生を豊かに", man(L.pmt, 1), "毎月の返済", `${L.buyAge}歳で ${man(o.price)}・${L.months}回・${L.endAge}歳で完済`, 2),

    // ライフイベント：出来事と、そのときの数字（stat）。地図の道の印・グラフの点・一覧で同じ文を使う

    if (f.marryAge != null && f.marryAge >= i.age) ev.push({ age: f.marryAge, label: "結婚", stat: `2人暮らしの家賃 ${manY(i.rent.couple)}` });
    if (f.kids > 0 && f.firstKidAge >= i.age) ev.push({ age: f.firstKidAge, label: "子どもが生まれる", stat: `子育て期の家賃 ${manY(i.rent.family)}` });
    ev.push({ age: L.buyAge, label: `家を買う（${man(o.price)}）`, stat: `毎月 ${man(L.pmt, 1)}×${L.months}回` });
    if (re.age < i.retireAge) ev.push({ age: re.age, label: "定年・再雇用", stat: L.atReemploy.left > 0 ? `年収 ${man(i.income * re.rate)}・ローン残り${L.atReemploy.left}回（残高 ${man(L.atReemploy.balance)}）` : `年収 ${man(i.income * re.rate)}・ローンは完済` });
    ev.push({ age: i.retireAge, label: "年金生活", stat: `年金 毎月 ${man(x.pension.monthly, 1)}` });
    ev.push({ age: L.endAge, label: "ローン完済", stat: `${L.months}回の返済が終わる` });
    ev.sort((p, q) => p.age - q.age);
    // 道の印：今（t=0）からGOAL（65歳、t=1）まで。同じ年齢の出来事は1つにまとめ、65歳より後の出来事はGOALの印に年齢つきで入れる
    const span = Math.max(1, i.retireAge - i.age), milestones = [];
    for (const e of ev) {
      const age = Math.min(e.age, i.retireAge), late = e.age > i.retireAge;
      const label = late ? `${e.label}（${e.age}歳）` : e.label;
      const last = milestones.at(-1);
      if (last && last.age === age) { last.label += "・" + label; last.stat += "／" + e.stat; continue; }
      const p = path.find((q) => q.age === age);
      milestones.push({ age, t: (age - i.age) / span, label, stat: e.stat, assets: p ? p.own : 0 });
    }
    const doneN = M.filter((m) => m.done).length;
    return {
      hero: { title: APP.name, kana: APP.kana, catch: APP.tagline,
        name: meta.customer && String(meta.customer).trim() ? String(meta.customer).trim() + " 様" : "あなた",

      goal: { label: `${i.retireAge}歳までに準備したいお金（賃貸のままの場合）`, target, ownTarget: x.prepare.ownNeed, now, pct: target > 0 ? Math.min(1, now / target) : 1 },
      areas, missions: M, events: ev, milestones,
      actions: [
        { title: i.nisa.monthly > 0 ? "NISAを続ける" : "NISAを始める", sub: "少しずつ、未来の資産を育てる", step: 0, icon: "nisa" },

        { title: "もしもに備える", sub: "団信・保険・金利が上がったら", step: 5, icon: "ins" },
        { title: "提案書をつくる", sub: "A4・4ページでお渡し", go: "proposal", icon: "plan" },
      ],
    };
  }

  const NOTES = [
    "金額はすべて概算です。年金は ねんきんネット・ねんきん定期便の見込額で確かめてください。",

    "ローンは月で数える（35年＝420回払い）。定年・65歳の時点の残りの回数と残高は、毎月同じ額を返す元利均等返済で計算。",
    "家賃の初期値 5.8万円は当社のお客様（20代後半・単身・賃貸）の家賃の中央値。社宅は自己負担2万円・30歳ごろまでと仮定（会社の規定で変わる。社宅の間は更新料なし）。",
    "老後の生活費（住居費を除く）・将来の家賃・物件価格・修繕費は仮定です。お客様の地域と暮らしに合わせて変えてください。",
    "家の価値は、土地は年−1%／0%／＋1%、建物は30年で1割まで下がると仮定した3つのシナリオです。",
    "高齢期の賃貸は、年齢や保証人を理由に入居を断られる場合がある（一般的な傾向）。家賃は収入の3分の1以内が入居審査の一般的な目安。",
    "住宅ローンの審査は返済比率（年収400万円未満30%・以上35%、フラット35の基準）で目安を表示。完済は80歳までが一般的で、年齢が上がると期間が短くなる。団信は健康状態で入れない場合がある。実際の審査は金融機関ごとに異なる。",
    "賃貸の更新料は2年ごとに家賃1か月分と仮定（地域・物件で0〜2か月）。社宅の間は更新料なし。",
    "住宅ローン控除は2026〜2027年入居の制度（令和8年度税制改正）で概算。単身は一般の限度額、結婚後（40歳未満）や子育て中に入居すると上乗せ。所得税→住民税（課税所得×5%・最高97,500円）の順に、払った税金の範囲で戻り、控除しきれない額は数えない。税額は給与収入だけの単身として概算〔要確認：源泉徴収票で確認〕。",

  ];

  return { APP, DEFAULT_COMPANY, home, RENT_AVG, proposal, preset, PRESETS, AVG_SALARY, FORBIDDEN, PENSION, CREDIT_KINDS, payment, balanceAfter, pension, estimateTax, defaults, compute, talk, NOTES, man, STAGE_LABEL };

<script>
// 共有リンク：条件を URL の # 以降に入れる（# 以降はサーバーに送られない）。お客様の名前は入れない
// Node：require("./lib/share")　ブラウザ：<script src="lib/share.js"> で window.LHSShare
(function (root, factory) {
  const m = factory();
  if (typeof module === "object" && module.exports) module.exports = m;
  else root.LHSShare = m;
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";
  const NULLABLE = new Set(["family.marryAge"]);
  // 文字の項目は決まった選択肢だけ受け付ける
  const ENUMS = { "own.kind": ["new_cert", "new_zeh", "new_energy", "used_zeh", "used_energy", "used_other", "none"] };
  const MAX = 1e9; // ありえない金額は受け付けない
  const b64e = (s) => (typeof btoa === "function" ? btoa(s) : Buffer.from(s, "binary").toString("base64")).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const b64d = (s) => {
    const t = s.replace(/-/g, "+").replace(/_/g, "/");
    return typeof atob === "function" ? atob(t) : Buffer.from(t, "base64").toString("binary");
  };
  const clone = (o) => JSON.parse(JSON.stringify(o));

  // 初期値と違う項目だけを取り出す
  function diff(cur, def) {
    const out = {};
    for (const k of Object.keys(def)) {
      const a = cur[k], b = def[k];
      if (b && typeof b === "object") {
        const d = diff(a || {}, b);
        if (Object.keys(d).length) out[k] = d;
      } else if (a !== b) out[k] = a;
    }
    return out;
  }
  // 初期値の形にあう項目だけを取り込む（知らない項目・型違い・範囲外は無視）
  function merge(target, src, path) {
    if (!src || typeof src !== "object") return;
    for (const k of Object.keys(target)) {
      if (!Object.prototype.hasOwnProperty.call(src, k)) continue;
      const p = path ? path + "." + k : k, v = src[k], t = target[k];
      if (t && typeof t === "object") merge(t, v, p);
      else if (typeof t === "boolean" && typeof v === "boolean") target[k] = v;
      else if (ENUMS[p]) { if (ENUMS[p].includes(v)) target[k] = v; }
      else if (v === null && NULLABLE.has(p)) target[k] = null;
      else if ((typeof t === "number" || NULLABLE.has(p)) && typeof v === "number" && Number.isFinite(v) && v >= 0 && v <= MAX) target[k] = v;
    }
  }

  function encode(state, { step = 0, present = false, defaults } = {}) {
    const def = defaults || (typeof LHS !== "undefined" ? LHS.defaults() : require("./engine").defaults());
    const parts = [];
    const d = diff(state, def);
    if (Object.keys(d).length) parts.push("s=" + b64e(JSON.stringify(d)));
    if (step) parts.push("step=" + step);
    if (present) parts.push("p=1");
    return "#" + parts.join("&");
  }

  function decode(hash, defaults) {
    const state = clone(defaults);
    let step = 0, present = false;
    const q = String(hash || "").replace(/^#/, "");
    for (const kv of q.split("&")) {
      const [k, v = ""] = kv.split("=");
      if (k === "s") { try { merge(state, JSON.parse(b64d(decodeURIComponent(v))), ""); } catch (e) { /* 壊れたリンクは初期値で開く */ } }
      if (k === "step") { const n = Number(v); if (Number.isInteger(n) && n >= 0 && n <= 7) step = n; }
      if (k === "p") present = v === "1";
    }
    return { state, step, present };
  }
  return { encode, decode };
});

  // ───── グラフ（SVG・手書き） ─────
  function lineChart(x) {
    const W = 720, H = 260, L = 64, B = 30, T = 14;
    let cr = 0, co = 0;
    const pts = x.years.map((y) => ({ age: y.age, r: (cr += y.rentYear), o: (co += y.ownYear) }));
    const max = Math.max(cr, co) * 1.05, a0 = pts[0].age, a1 = pts.at(-1).age;
    const X = (a) => L + ((a - a0) / (a1 - a0)) * (W - L - 12), Y = (v) => T + (1 - v / max) * (H - T - B);
    const path = (k) => pts.map((p, i) => `${i ? "L" : "M"}${X(p.age).toFixed(1)},${Y(p[k]).toFixed(1)}`).join("");
    let g = "";
    for (let v = 0; v <= max; v += 10_000_000) g += `<line x1="${L}" x2="${W - 12}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eceef1"/><text x="${L - 6}" y="${Y(v) + 4}" font-size="11" text-anchor="end" fill="#5b616b">${(v / 1e4).toLocaleString()}万</text>`;
    for (let a = Math.ceil(a0 / 10) * 10; a <= a1; a += 10) g += `<text x="${X(a)}" y="${H - 10}" font-size="11" text-anchor="middle" fill="#5b616b">${a}歳</text>`;
    const ret = x.input.retireAge;
    g += `<line x1="${X(ret)}" x2="${X(ret)}" y1="${T}" y2="${H - B}" stroke="#b08d57" stroke-dasharray="4 4"/><text x="${X(ret) + 4}" y="${T + 12}" font-size="11" fill="#b08d57">${ret}歳（年金生活）</text>`;
    const end = pts.at(-1);
    g += `<path d="${path("r")}" fill="none" stroke="var(--rent)" stroke-width="3"/><path d="${path("o")}" fill="none" stroke="var(--own)" stroke-width="3"/>`;
    g += `<text x="${X(end.age) - 4}" y="${Y(end.r) - 6}" font-size="12" text-anchor="end" fill="var(--rent)" font-weight="700">賃貸 ${man(end.r)}</text>`;
    g += `<text x="${X(end.age) - 4}" y="${Y(end.o) + 16}" font-size="12" text-anchor="end" fill="var(--own)" font-weight="700">持ち家 ${man(end.o)}</text>`;
    return `<div class="legend"><span><i style="background:var(--rent)"></i>賃貸のまま（累計）</span><span><i style="background:var(--own)"></i>持ち家（累計）</span></div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="住居費の累計">${g}</svg>`;
  }

  function hbars(rows, unit = "") {
    const W = 560, rowH = 34, max = Math.max(...rows.map((r) => r.parts.reduce((s2, p) => s2 + p[1], 0))) * 1.12 || 1;
    let g = "";

      g += `<text x="0" y="${y + 18}" font-size="13" fill="#1d1f23">${esc(r.label)}</text>`;

        x0 += w2; total += v;
      }
      g += `<text x="${x0 + 6}" y="${y + 19}" font-size="13" font-weight="700" fill="#1d1f23">${r.text || man(total) + unit}</text>`;

        { label: `${x.input.retireAge}歳・持ち家`, parts: [["預貯金", pf.at65.own.savings, C.sav], ["NISA", pf.at65.own.nisa, C.nisa], ["不動産", pf.at65.own.realEstate, C.re]] },
      ])}${legend([["預貯金", C.sav], ["NISA", C.nisa], ["不動産（家の価値−残りのローン）", C.re]])}
      <p class="small">保険：毎月 ${man(pf.now.insuranceMonthly, 1)}（${x.input.retireAge}歳まで ${man(x.insurance.rentLife)}）。NISA は毎月 ${man(pf.now.nisaMonthly, 1)} を年${(x.input.nisa.rate * 100).toFixed(0)}%で運用できた場合（元本保証なし）。</p></div></div>`;

    $("home").querySelectorAll("input[data-m]").forEach((el) => (el.onchange = () => { missionDone[el.dataset.m] = el.checked; renderHome(); }));
    const nm = $("hName");
    nm.oninput = () => { meta.customer = nm.value; const f = $("form").querySelector('input[data-m="customer"]'); if (f) f.value = nm.value; };
    nm.onchange = () => { renderHome(); $("hName").focus(); };
  }
  function openHome() { document.body.classList.remove("present", "proposal-view"); document.body.classList.add("home-view"); renderHome(); window.scrollTo(0, 0); }
  function openStep(i) { document.body.classList.remove("home-view"); cur = i; all = false; render(); window.scrollTo(0, 0); }
  let cur = opened.step, all = false, LAST = 7;
  const toast = (t) => { const el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => (el.style.display = "none"), 2200); };
  const present = (on) => { document.body.classList.toggle("present", on); all = false; render(); };
  const syncUrl = () => { try { history.replaceState(null, "", window.LHSShare.encode(state, { step: cur, present: document.body.classList.contains("present"), defaults: S.defaults() }) || "#"); } catch (e) { /* file:// などで使えない場合は何もしない */ } };
  function render() {
    const x = S.compute(state), steps = S.talk(x);
    LAST = steps.length - 1;
    const visual = [
      portfolioView(x),
      stageTable(x),
      `<div class="kpis dup"><div class="kpi rent"><span>一生の住居費（賃貸のまま）</span><b>${man(x.life.rent)}</b></div><div class="kpi own"><span>一生の住居費（持ち家・控除後）</span><b>${man(x.life.own)}</b></div><div class="kpi"><span>住宅ローン控除で戻る税金</span><b style="color:var(--ok)">${man(x.credit.total)}</b><span>${x.credit.years}年・1年目 ${man(x.credit.first, 1)}</span></div></div><div class="two"><div>${lineChart(x)}${breakdownNote(x)}</div><div>${breakdownTable(x)}</div></div>`,
      oldBars(x) + `<div class="kpis"><div class="kpi rent"><span>老後の毎月の不足（賃貸）</span><b>${man(x.old.rent.gapMonthly, 1)}</b></div><div class="kpi own"><span>老後の毎月の不足（持ち家）</span><b>${man(x.old.own.gapMonthly, 1)}</b></div><div class="kpi"><span>老後${x.old.years}年の家賃の合計</span><b>${man(x.old.rent.rentTotal)}</b></div></div>`,
      `<div class="kpis"><div class="kpi rent"><span>${state.retireAge}歳までに準備（賃貸のまま）</span><b>${man(x.prepare.rentNeed)}</b><span>毎月 ${man(x.prepare.monthlyRent, 1)} の積立</span></div><div class="kpi own"><span>${state.retireAge}歳までに準備（持ち家）</span><b>${man(x.prepare.ownNeed)}</b><span>毎月 ${man(x.prepare.monthlyOwn, 1)} の積立</span></div><div class="kpi"><span>差</span><b>${man(x.prepare.rentExtra)}</b><span>持たない場合に多く必要</span></div></div>`,
      `<div class="kpis"><div class="kpi rent"><span>老後の賃貸の入居審査（家賃÷年金）</span><b>${Math.round(x.screening.rent.ratioOld * 100)}%</b><span>目安は3分の1（33%）以内${x.screening.rent.hard ? "・通りにくくなる場合あり" : ""}</span></div><div class="kpi own"><span>万一のとき残るローン（団信）</span><b>${man(0)}</b><span>${x.input.family.marryAge == null ? "親や兄弟に残らない" : "家族に住まいが残る"}</span></div>${x.input.family.marryAge == null ? "" : `<div class="kpi rent"><span>賃貸なら家族が払い続ける家賃</span><b>${man(x.whatIf.danshinRentContinues, 1)}</b><span>毎月</span></div>`}<div class="kpi"><span>金利が1%上がったら</span><b>${man(x.whatIf.rateUpPmt, 1)}</b><span>今の計画 ${man(x.whatIf.pmt, 1)}／毎月</span></div></div>${insurancePanel(x)}`,
      `<div class="kpis"><div class="kpi"><span>${state.retireAge}歳の家の価値（横ばい）</span><b>${man(x.value65.flat)}</b><span>下落 ${man(x.value65.down)}／上昇 ${man(x.value65.up)}</span></div><div class="kpi"><span>参考：差額を積み立て運用した場合</span><b>${man(x.fair.rentInvested65)}</b><span>年${(x.fair.rate * 100).toFixed(0)}%・元本保証なし</span></div></div><p style="font-size:13px;color:#5b616b;margin:0 0 8px">※家の価値は将来の価格を約束するものではありません。運用も元本保証はありません。</p>`,
      waitView(x),
    ];
    $("tabs").innerHTML = `<button class="home" data-home="1" title="トップ（LIFE ROUTE）">★</button>` + steps.map((s, i) => `<button class="${i === cur && !all ? "on" : ""}" data-i="${i}">${esc(s.title.slice(0, 1))}</button>`).join("");
    $("tabs").querySelectorAll("button").forEach((b) => (b.onclick = () => { if (b.dataset.home) return openHome(); cur = +b.dataset.i; all = false; render(); }));
    $("steps").innerHTML = steps.map((s, i) => `<div class="step" style="display:${all || i === cur ? "block" : "none"}">
      <h2 class="stage-title">${esc(s.title)}</h2><p class="say">${esc(s.say)}</p>${visual[i]}<p class="show">${esc(s.show)}</p><p class="ask">${esc(s.ask)}</p></div>`).join("");
    $("prev").disabled = cur === 0; $("next").disabled = cur === steps.length - 1;
    $("notes").innerHTML = S.NOTES.map((n) => `<li>${esc(n)}</li>`).join("");
    $("pCount").textContent = `${cur + 1} / ${steps.length}`;
    syncUrl();
  }
  const go = (d) => { cur = Math.min(LAST, Math.max(0, cur + d)); all = false; render(); };
  $("present").onclick = () => present(true);
  $("prop").onclick = showProposal;
  $("pvBack").onclick = () => { document.body.classList.remove("proposal-view"); render(); };
  $("pvPrint").onclick = () => window.print();
  $("pExit").onclick = () => present(false);
  $("pPrev").onclick = () => go(-1);
  $("pNext").onclick = () => go(1);
  const full = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); };
  $("pFull").onclick = full;
  $("link").onclick = async () => {
    const url = location.href.split("#")[0] + window.LHSShare.encode(state, { step: 0, present: true, defaults: S.defaults() });
    try { await navigator.clipboard.writeText(url); toast("共有リンクをコピーしました（条件の数字だけが入り、お名前は入りません）"); }
    catch (e) { prompt("このリンクをコピーしてください", url); }
  };
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    if (document.body.classList.contains("home-view")) return;
    if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(1); }
    else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(-1); }
    else if (e.key === "p" || e.key === "P") present(!document.body.classList.contains("present"));
    else if (e.key === "f" || e.key === "F") full();
    else if (e.key === "Escape" && document.body.classList.contains("present") && !document.fullscreenElement) present(false);
  });
  $("prev").onclick = () => go(-1);
  $("next").onclick = () => go(1);
  $("all").onclick = () => { all = !all; render(); };
  $("print").onclick = () => { all = true; render(); window.print(); };
  $("toHome").onclick = openHome;
  buildForm(); if (opened.present) document.body.classList.add("present"); render();
  // 最初に開いたときはトップページ（共有リンクで step・画面共有の指定があるときはそのステップから）
  if (!opened.present && !/step=/.test(location.hash)) openHome();
})();
</script>
</body>
</html>

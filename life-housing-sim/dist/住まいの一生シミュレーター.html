<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>住まいの一生シミュレーター</title>
<style>
  :root { --navy:#1f2a44; --gold:#b08d57; --ink:#1d1f23; --sub:#5b616b; --line:#dcdfe4; --bg:#f6f4ef; --card:#fff;
          --rent:#c2581e; --own:#2a5c9a; --ok:#2e7d32; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif; color:var(--ink); background:var(--bg); line-height:1.6; }
  header { background:var(--navy); color:#fff; padding:14px 20px; display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; }
  header h1 { margin:0; font-size:19px; letter-spacing:.05em; }
  header p { margin:0; font-size:12px; opacity:.8; }
  main { display:grid; grid-template-columns:minmax(260px,330px) 1fr; gap:16px; padding:16px; max-width:1400px; margin:0 auto; }
  @media (max-width:920px){ main{ grid-template-columns:1fr; } }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .form h2 { font-size:13px; color:var(--navy); margin:12px 0 6px; border-left:4px solid var(--gold); padding-left:7px; }
  .form h2:first-child { margin-top:0; }
  label { display:grid; grid-template-columns:1fr 140px; gap:8px; align-items:center; font-size:13px; margin:5px 0; }
  select { font:inherit; font-size:13px; padding:5px 6px; border:1px solid #c9b48a; border-radius:7px; background:#fff8e6; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .tabs button { font:inherit; font-size:13px; border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 12px; cursor:pointer; color:var(--sub); }
  .tabs button.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  .stage-title { font-size:22px; color:var(--navy); margin:4px 0 8px; }
  .say { font-size:17px; margin:0 0 12px; }
  .show { font-size:15px; background:#faf7f0; border:1px solid #eadfc8; border-radius:10px; padding:10px 12px; margin:0 0 12px; }
  .ask { font-size:14px; color:var(--navy); background:#eef2f8; border-radius:10px; padding:8px 12px; margin:0 0 12px; }
  .ask::before { content:"お客様に聞く："; font-weight:700; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin:10px 0; }
  .kpi { border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:#fff; }
  .kpi span { font-size:12px; color:var(--sub); display:block; }
  .kpi b { font-size:22px; font-variant-numeric:tabular-nums; }
  .kpi.rent b { color:var(--rent); } .kpi.own b { color:var(--own); }
  .legend { display:flex; gap:16px; font-size:12px; color:var(--sub); margin:4px 0; }
  .legend i { display:inline-block; width:14px; height:3px; vertical-align:middle; margin-right:5px; }
  svg text { font-family:inherit; }
  .nav { display:flex; justify-content:space-between; margin-top:12px; }
  .nav button, .tools button { font:inherit; font-size:14px; border:1px solid var(--navy); background:#fff; color:var(--navy); border-radius:8px; padding:8px 16px; cursor:pointer; }
  .nav button.primary { background:var(--navy); color:#fff; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .notes { font-size:11px; color:var(--sub); margin-top:14px; }
  .notes li { margin:2px 0; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:right; }
  th:first-child, td:first-child { text-align:left; }
  @media print {
    header, .form, .tabs, .nav, .tools { display:none !important; }
    main { display:block; padding:0; } body { background:#fff; } .panel { border:none; padding:0; }
    .step { display:block !important; break-inside:avoid; margin-bottom:18px; }
  }
</style>
</head>
<body>
<header>
  <h1>住まいの一生シミュレーター</h1>
  <p>賃貸のまま／持ち家 を、今から95歳まで同じ物差しで。どのお客様にも ①〜⑥ の同じ順番で説明します（概算・通信なし・保存なし）</p>
</header>
<main>
  <section class="panel form" id="form"></section>
  <section class="panel">
    <div class="tabs" id="tabs"></div>
    <div id="steps"></div>
    <div class="nav"><button id="prev">← 前へ</button><button class="primary" id="next">次へ →</button></div>
    <div class="tools"><button id="all">全部を1ページで見る（印刷用）</button><button id="print">印刷・PDF</button></div>
    <ul class="notes" id="notes"></ul>
  </section>
</main>
<script>
// 住まいの一生シミュレーター（計算）：賃貸のまま／持ち家 を、今から95歳まで同じ前提で比べる
// 依存なし。Node：require("./lib/engine")　ブラウザ：<script src="lib/engine.js"> で window.LHS
(function (root, factory) {
  const m = factory();
  if (typeof module === "object" && module.exports) module.exports = m;
  else root.LHS = m;
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  // お客様に言わない表現（事実に反する・断定・あおり）
  const FORBIDDEN = [/必ず値上がり/, /絶対に損(し|は)ない/, /今買わないと損/, /家賃は(無駄|捨て)/, /返済(は|が)(すべて|全部)資産/, /必ず売れる/, /土地は必ず/, /残りわずか/, /今だけ/];

  // 年金の概算に使う数字（令和8年度。日本年金機構の資料による。毎年度改定）
  const PENSION = {
    basicFull: 847_300,        // 老齢基礎年金の満額（年額）
    kouseiRate: 5.481 / 1000,  // 厚生年金（報酬比例部分）の乗率（2003年4月以降の加入期間）
    salaryCap: 650_000,        // 標準報酬月額の上限
  };

  const man = (v, d = 0) => (v == null ? "—" : (v / 10_000).toLocaleString("ja-JP", { minimumFractionDigits: d, maximumFractionDigits: d }) + "万円");

  function payment(P, rate, years) {
    if (P <= 0) return 0;
    const r = rate / 12, n = years * 12;
    if (r === 0) return P / n;
    const g = Math.pow(1 + r, n);
    return (P * r * g) / (g - 1);
  }
  function balanceAfter(P, rate, years, months) {
    const r = rate / 12, pm = payment(P, rate, years), k = Math.min(months, years * 12);
    if (r === 0) return Math.max(0, P - pm * k);
    const g = Math.pow(1 + r, k);
    return Math.max(0, P * g - (pm * (g - 1)) / r);
  }

  // 年金の概算（年額）：基礎年金（満額と仮定）＋厚生年金（平均の月給 × 乗率 × 加入月数）
  function pension(income, workStart, retireAge) {
    const avg = Math.min(PENSION.salaryCap, Math.max(0, income) / 12);
    const months = Math.max(0, retireAge - workStart) * 12;
    const kousei = income > 0 ? avg * PENSION.kouseiRate * months : 0;
    const yearly = Math.round(PENSION.basicFull + kousei);
    return { yearly, monthly: yearly / 12, basic: PENSION.basicFull, kousei: Math.round(kousei) };
  }

  // 商談報告（#03）の中央値に近いお客様像：27歳・年収390万・貯金140万。家賃は将来の暮らしに合わせた目安（仮定）
  function defaults() {
    return {
      age: 27, income: 3_900_000, savings: 1_400_000, workStart: 22, retireAge: 65, lifeEnd: 95,
      family: { marryAge: 30, kids: 1, firstKidAge: 32 },
      partnerIncome: 0,
      rent: { single: 55_000, couple: 75_000, family: 90_000, old: 70_000, renewMonths: 1, renewEvery: 2 },
      own: { buyAge: 30, price: 28_000_000, landShare: 0.35, down: 0, costRate: 0.07, financeCosts: true, rate: 0.012, years: 35,
        propTax: 100_000, ins: 30_000, repairYear: 150_000, repairUpAfter: 20, repairUpRate: 1.5 },
      oldLiving: { single: 130_000, couple: 220_000 },
      landRates: { down: -0.01, flat: 0, up: 0.01 },
      invest: { on: false, rate: 0.03 },
    };
  }

  function stage(inp, age) {
    const f = inp.family || {};
    if (age >= inp.retireAge) return "old";
    if (f.kids > 0 && f.firstKidAge != null && age >= f.firstKidAge && age < f.firstKidAge + 22) return "family";
    if (f.marryAge != null && age >= f.marryAge) return "couple";
    return "single";
  }
  const STAGE_LABEL = { single: "ひとり暮らし", couple: "2人暮らし", family: "子育て", old: "老後" };

  function compute(input) {
    const d = defaults();
    const inp = { ...d, ...input, family: { ...d.family, ...(input.family || {}) }, rent: { ...d.rent, ...(input.rent || {}) },
      own: { ...d.own, ...(input.own || {}) }, oldLiving: { ...d.oldLiving, ...(input.oldLiving || {}) },
      landRates: { ...d.landRates, ...(input.landRates || {}) }, invest: { ...d.invest, ...(input.invest || {}) } };
    const o = inp.own, R = inp.rent;
    const married = inp.family.marryAge != null;
    const cost = o.price * o.costRate;
    const loan = o.price - o.down + (o.financeCosts ? cost : 0);
    const cashAtBuy = o.down + (o.financeCosts ? 0 : cost);
    const pmt = payment(loan, o.rate, o.years);
    const buyAge = Math.max(inp.age, o.buyAge);
    const loanEnd = buyAge + o.years;

    const me = pension(inp.income, inp.workStart, inp.retireAge);
    const partner = married ? (inp.partnerIncome > 0 ? pension(inp.partnerIncome, inp.workStart, inp.retireAge) : { yearly: PENSION.basicFull }) : { yearly: 0 };
    const pensionYearly = me.yearly + partner.yearly;
    const living = married ? inp.oldLiving.couple : inp.oldLiving.single;

    const years = [];
    for (let age = inp.age; age < inp.lifeEnd; age++) {
      const st = stage(inp, age);
      const rentMonthly = R[st];
      const rentYear = rentMonthly * 12 + (rentMonthly * R.renewMonths) / R.renewEvery;
      let ownYear, ownLoan = 0, ownUpkeep = 0, cash = 0;
      if (age < buyAge) ownYear = rentYear;
      else {
        if (age === buyAge) cash = cashAtBuy;
        ownLoan = age < loanEnd ? pmt * 12 : 0;
        const held = age - buyAge;
        ownUpkeep = o.propTax + o.ins + o.repairYear * (held >= o.repairUpAfter ? o.repairUpRate : 1);
        ownYear = cash + ownLoan + ownUpkeep;
      }
      years.push({ age, stage: st, stageLabel: STAGE_LABEL[st], rentMonthly, rentYear, ownYear, ownLoan, ownUpkeep });
    }

    const sum = (arr, k) => arr.reduce((s, y) => s + y[k], 0);
    const oldYears = years.filter((y) => y.age >= inp.retireAge);
    const oldOf = (k, housingK) => {
      const out = oldYears.map((y) => living * 12 + y[housingK]);
      const gaps = out.map((v) => Math.max(0, v - pensionYearly));
      const need = gaps.reduce((s, v) => s + v, 0);
      return { housingTotal: sum(oldYears, housingK), need, gapMonthly: oldYears.length ? need / oldYears.length / 12 : 0,
        outMonthly: oldYears.length ? out.reduce((s, v) => s + v, 0) / oldYears.length / 12 : 0 };
    };
    const oldRent = { ...oldOf("rent", "rentYear"), rentTotal: sum(oldYears, "rentYear") };
    const oldOwn = oldOf("own", "ownYear");
    const monthsToRetire = Math.max(1, (inp.retireAge - inp.age) * 12);

    // 65歳時点の家の価値（土地は年率で変化、建物は30年で1割まで直線で下がると仮定）
    const t = Math.max(0, inp.retireAge - buyAge);
    const bldg = o.price * (1 - o.landShare) * Math.max(0.1, 1 - (0.9 * t) / 30);
    const landAt = (r) => o.price * o.landShare * Math.pow(1 + r, t);
    const balance65 = balanceAfter(loan, o.rate, o.years, t * 12);
    const value65 = { down: landAt(inp.landRates.down) + bldg, flat: landAt(inp.landRates.flat) + bldg, up: landAt(inp.landRates.up) + bldg, bldg, balance: balance65 };

    // 公平な比較：賃貸の人が「持ち家との差額」を毎年積み立てて運用した場合の65歳時点の額（運用は元本保証なし）
    let fv = 0;
    for (const y of years.filter((y) => y.age >= buyAge && y.age < inp.retireAge)) fv = fv * (1 + inp.invest.rate) + Math.max(0, y.ownYear - y.rentYear);

    return {
      input: inp,
      years,
      loan: { amount: loan, pmt, cashAtBuy, buyAge, endAge: loanEnd },
      pension: { me, partnerYearly: partner.yearly, yearly: pensionYearly, monthly: pensionYearly / 12, living },
      life: { rent: sum(years, "rentYear"), own: sum(years, "ownYear") },
      old: { rent: oldRent, own: oldOwn, years: oldYears.length },
      prepare: { rentNeed: oldRent.need, ownNeed: oldOwn.need, rentExtra: oldRent.need - oldOwn.need,
        monthlyRent: oldRent.need / monthsToRetire, monthlyOwn: oldOwn.need / monthsToRetire, months: monthsToRetire },
      value65,
      whatIf: { pmt, rateUpPmt: payment(loan, o.rate + 0.01, o.years), danshinLoanAfter: 0, danshinRentContinues: married ? R.couple : R.single },
      fair: { rentInvested65: fv, rate: inp.invest.rate, note: `持ち家との差額を毎年積み立てて、年${(inp.invest.rate * 100).toFixed(0)}%で運用できた場合（運用は元本保証なし。続けられるかが前提）` },
    };
  }

  // どのお客様にも同じ順番で説明する6ステップ（話すこと・見せる数字・お客様への質問）
  function talk(x) {
    const i = x.input, o = i.own;
    const stages = [...new Set(x.years.map((y) => y.stageLabel))];
    const r = x.old.rent, w = x.old.own;
    return [
      { title: "① これからの暮らしの段階", say: `家賃は暮らしの段階で変わります。${stages.join(" → ")} と進むと、広い部屋が必要な時期に家賃も上がります。`,
        show: x.input.family.marryAge != null ? `ひとり ${man(i.rent.single, 1)} → 2人 ${man(i.rent.couple, 1)} → 子育て ${man(i.rent.family, 1)} → 老後 ${man(i.rent.old, 1)}（毎月）` : `ひとり ${man(i.rent.single, 1)} → 老後 ${man(i.rent.old, 1)}（毎月）`,
        ask: "結婚・お子さま・働き方は、何歳ごろにどうなっていたいですか。" },
      { title: "② 一生でかかる住まいのお金", say: `今から${i.lifeEnd}歳まで、住まいには一生お金がかかります。賃貸は払い続け、持ち家は返済が終わったあとは税金・保険・修繕だけになります。`,
        show: `一生の住居費　賃貸のまま ${man(x.life.rent)}／持ち家 ${man(x.life.own)}（${o.buyAge}歳で${man(o.price)}の家を買った場合）`,
        ask: "一生の住まいのお金を、今まで計算したことはありますか。" },
      { title: `③ ${i.retireAge}歳からの${x.old.years}年`, say: `${i.retireAge}歳からは年金が収入の中心です。賃貸のままだと、年金から家賃を払い続けることになります。持ち家は${x.loan.endAge}歳で返済が終わる計画です。`,
        show: `年金（概算）毎月 ${man(x.pension.monthly, 1)}／毎月の支出　賃貸 ${man(r.outMonthly, 1)}・持ち家 ${man(w.outMonthly, 1)}／毎月の不足　賃貸 ${man(r.gapMonthly, 1)}・持ち家 ${man(w.gapMonthly, 1)}`,
        ask: "老後の住まいは、どこで、どんな家に住んでいたいですか。" },
      { title: "④ 持たないなら、いくら準備が必要か", say: `賃貸のままでも、老後の家賃のぶんを今から準備できれば大丈夫です。そのために必要な金額を見てみましょう。`,
        show: `${i.retireAge}歳までに準備したいお金　賃貸のまま ${man(x.prepare.rentNeed)}（毎月 ${man(x.prepare.monthlyRent, 1)} の積立）／持ち家 ${man(x.prepare.ownNeed)}（毎月 ${man(x.prepare.monthlyOwn, 1)}）`,
        ask: `毎月 ${man(x.prepare.monthlyRent, 1)} を${i.retireAge}歳まで積み立て続けられそうですか。` },
      { title: "⑤ もしものとき", say: `住宅ローンには団体信用生命保険（団信）が付き、万一のときは残りのローンが保険で返済され、家族に住まいが残ります。賃貸の場合、家族は家賃を払い続けます。高齢になると、年齢を理由に賃貸の入居を断られることもあります。金利が上がると返済が増える点は持ち家の注意点です。`,
        show: `団信：万一のときの残りのローン ${man(x.whatIf.danshinLoanAfter)}（賃貸なら家族は毎月 ${man(x.whatIf.danshinRentContinues, 1)} を払い続ける）／金利が1%上がったら毎月の返済 ${man(x.whatIf.pmt, 1)} → ${man(x.whatIf.rateUpPmt, 1)}`,
        ask: "ご家族に、どんな形で住まいを残したいですか。金利が上がったときの備えはありますか。" },
      { title: "⑥ まとめ：持つ・持たない、それぞれの準備", say: `どちらが正解ということはありません。持つなら、無理のない返済と修繕の備え。持たないなら、老後の家賃のための積立。「持たない」を選ぶ場合も、準備が必要だと知ったうえで選ぶことが大切です。`,
        show: `${i.retireAge}歳時点の家の価値（概算）　下落 ${man(x.value65.down)}／横ばい ${man(x.value65.flat)}／上昇 ${man(x.value65.up)}　※将来の価格を約束するものではありません／参考：差額を積み立てて運用した場合 ${man(x.fair.rentInvested65)}（${x.fair.note}）`,
        ask: "どちらの準備なら、ご自身に合っていると思いますか。" },
    ];
  }

  const NOTES = [
    "金額はすべて概算です。年金は ねんきんネット・ねんきん定期便の見込額で確かめてください。",
    "年金は基礎年金を満額、厚生年金を「年収÷12 × 5.481/1000 × 加入月数」で概算（令和8年度の数字。賞与・昇給・加入期間で変わる）。",
    "老後の生活費（住居費を除く）・将来の家賃・物件価格・修繕費は仮定です。お客様の地域と暮らしに合わせて変えてください。",
    "家の価値は、土地は年−1%／0%／＋1%、建物は30年で1割まで下がると仮定した3つのシナリオです。",
    "高齢期の賃貸は、年齢や保証人を理由に入居を断られる場合がある（一般的な傾向）。",
  ];

  return { FORBIDDEN, PENSION, payment, balanceAfter, pension, defaults, compute, talk, NOTES, man, STAGE_LABEL };
});

</script>
<script>
(function () {
  "use strict";
  const S = window.LHS, $ = (id) => document.getElementById(id), man = S.man;
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const range = (a, b, st) => { const o = []; for (let v = a; v <= b + 1e-9; v += st) o.push(Math.round(v * 1e6) / 1e6); return o; };
  const yen = (v) => man(v, v % 10000 ? 1 : 0);

  // 選ぶだけの入力（値は円・歳・率）
  const FIELDS = [
    ["あなたのこと"],
    ["age", "今の年齢", range(20, 55, 1), (v) => v + "歳"],
    ["income", "年収（税込）", range(2_500_000, 12_000_000, 100_000), yen],
    ["savings", "今の貯金", [0, 300_000, 500_000, 800_000, 1_000_000, 1_400_000, 2_000_000, 3_000_000, 5_000_000, 8_000_000, 10_000_000], yen],
    ["これからの暮らし"],
    ["family.marryAge", "結婚する年齢", [null, ...range(22, 45, 1)], (v) => (v == null ? "結婚しない・未定" : v + "歳")],
    ["family.kids", "子ども", [0, 1, 2], (v) => (v ? v + "人" : "なし")],
    ["family.firstKidAge", "第1子が生まれる年齢", range(22, 45, 1), (v) => v + "歳"],
    ["partnerIncome", "パートナーの年収", [0, 1_000_000, 2_000_000, 3_000_000, 4_000_000, 5_000_000], (v) => (v ? yen(v) : "なし・扶養内")],
    ["賃貸の家賃（毎月・その地域の目安）"],
    ["rent.single", "ひとり暮らし", range(30_000, 120_000, 5_000), yen],
    ["rent.couple", "2人暮らし", range(40_000, 150_000, 5_000), yen],
    ["rent.family", "子育て期（広い部屋）", range(50_000, 180_000, 5_000), yen],
    ["rent.old", "老後", range(30_000, 150_000, 5_000), yen],
    ["持ち家（買う場合）"],
    ["own.buyAge", "買う年齢", range(20, 55, 1), (v) => v + "歳"],
    ["own.price", "物件価格", range(10_000_000, 60_000_000, 1_000_000), yen],
    ["own.rate", "金利（年）", range(0.005, 0.03, 0.001), (v) => (v * 100).toFixed(1) + "%"],
    ["own.years", "返済年数", range(20, 35, 1), (v) => v + "年"],
    ["老後の生活費（住居費を除く・毎月）"],
    ["oldLiving.single", "ひとりの場合", range(80_000, 250_000, 10_000), yen],
    ["oldLiving.couple", "夫婦の場合", range(120_000, 350_000, 10_000), yen],
  ];
  const state = S.defaults();
  const get = (o, p) => p.split(".").reduce((a, k) => a?.[k], o);
  const set = (o, p, v) => { const ks = p.split("."); let a = o; ks.slice(0, -1).forEach((k) => (a = a[k])); a[ks.at(-1)] = v; };

  function buildForm() {
    let h = "";
    for (const f of FIELDS) {
      if (f.length === 1) { h += `<h2>${esc(f[0])}</h2>`; continue; }
      const [key, label, opts, fmt] = f;
      const cur = get(state, key);
      h += `<label>${esc(label)}<select data-k="${key}">${opts.map((v, i) => `<option value="${i}"${v === cur ? " selected" : ""}>${esc(fmt(v))}</option>`).join("")}</select></label>`;
    }
    $("form").innerHTML = h;
    $("form").querySelectorAll("select").forEach((sel) => {
      const f = FIELDS.find((x) => x[0] === sel.dataset.k);
      if (![...sel.options].some((o) => o.selected)) { f[2].push(get(state, f[0])); }
      sel.onchange = () => { set(state, f[0], f[2][sel.value]); render(); };
    });
  }

  // ───── グラフ（SVG・手書き） ─────
  function lineChart(x) {
    const W = 720, H = 260, L = 64, B = 30, T = 14;
    let cr = 0, co = 0;
    const pts = x.years.map((y) => ({ age: y.age, r: (cr += y.rentYear), o: (co += y.ownYear) }));
    const max = Math.max(cr, co) * 1.05, a0 = pts[0].age, a1 = pts.at(-1).age;
    const X = (a) => L + ((a - a0) / (a1 - a0)) * (W - L - 12), Y = (v) => T + (1 - v / max) * (H - T - B);
    const path = (k) => pts.map((p, i) => `${i ? "L" : "M"}${X(p.age).toFixed(1)},${Y(p[k]).toFixed(1)}`).join("");
    let g = "";
    for (let v = 0; v <= max; v += 10_000_000) g += `<line x1="${L}" x2="${W - 12}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eceef1"/><text x="${L - 6}" y="${Y(v) + 4}" font-size="11" text-anchor="end" fill="#5b616b">${(v / 1e4).toLocaleString()}万</text>`;
    for (let a = Math.ceil(a0 / 10) * 10; a <= a1; a += 10) g += `<text x="${X(a)}" y="${H - 10}" font-size="11" text-anchor="middle" fill="#5b616b">${a}歳</text>`;
    const ret = x.input.retireAge;
    g += `<line x1="${X(ret)}" x2="${X(ret)}" y1="${T}" y2="${H - B}" stroke="#b08d57" stroke-dasharray="4 4"/><text x="${X(ret) + 4}" y="${T + 12}" font-size="11" fill="#b08d57">${ret}歳（年金生活）</text>`;
    const end = pts.at(-1);
    g += `<path d="${path("r")}" fill="none" stroke="var(--rent)" stroke-width="3"/><path d="${path("o")}" fill="none" stroke="var(--own)" stroke-width="3"/>`;
    g += `<text x="${X(end.age) - 4}" y="${Y(end.r) - 6}" font-size="12" text-anchor="end" fill="var(--rent)" font-weight="700">賃貸 ${man(end.r)}</text>`;
    g += `<text x="${X(end.age) - 4}" y="${Y(end.o) + 16}" font-size="12" text-anchor="end" fill="var(--own)" font-weight="700">持ち家 ${man(end.o)}</text>`;
    return `<div class="legend"><span><i style="background:var(--rent)"></i>賃貸のまま（累計）</span><span><i style="background:var(--own)"></i>持ち家（累計）</span></div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="住居費の累計">${g}</svg>`;
  }
  function oldBars(x) {
    const rows = [["年金（概算）", x.pension.monthly, "#2e7d32"], ["賃貸のままの支出", x.old.rent.outMonthly, "var(--rent)"], ["持ち家の支出", x.old.own.outMonthly, "var(--own)"]];
    const max = Math.max(...rows.map((r) => r[1])) * 1.1, W = 720, rowH = 44;
    let g = "";
    rows.forEach(([lb, v, c], i) => {
      const y = 8 + i * rowH, w = (v / max) * (W - 200);
      g += `<text x="0" y="${y + 20}" font-size="13" fill="#1d1f23">${lb}</text><rect x="150" y="${y + 4}" width="${w}" height="24" rx="4" fill="${c}"/><text x="${156 + w}" y="${y + 21}" font-size="13" font-weight="700" fill="${c}">毎月 ${man(v, 1)}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${rows.length * rowH + 10}" width="100%" role="img" aria-label="老後の毎月">${g}</svg>`;
  }
  function stageTable(x) {
    const segs = [];
    for (const y of x.years) { const last = segs.at(-1); if (last && last.label === y.stageLabel) last.to = y.age; else segs.push({ label: y.stageLabel, from: y.age, to: y.age, rent: y.rentMonthly }); }
    return `<table><tr><th>暮らしの段階</th><th>年齢</th><th>家賃（毎月）</th></tr>${segs.map((s) => `<tr><td>${s.label}</td><td>${s.from}〜${s.to}歳</td><td>${man(s.rent, 1)}</td></tr>`).join("")}</table>`;
  }

  let cur = 0, all = false;
  function render() {
    const x = S.compute(state), steps = S.talk(x);
    const visual = [
      stageTable(x),
      `<div class="kpis"><div class="kpi rent"><span>一生の住居費（賃貸のまま）</span><b>${man(x.life.rent)}</b></div><div class="kpi own"><span>一生の住居費（持ち家）</span><b>${man(x.life.own)}</b></div><div class="kpi"><span>毎月の返済（${(state.own.rate * 100).toFixed(1)}%・${state.own.years}年）</span><b>${man(x.loan.pmt, 1)}</b></div></div>${lineChart(x)}`,
      oldBars(x) + `<div class="kpis"><div class="kpi rent"><span>老後の毎月の不足（賃貸）</span><b>${man(x.old.rent.gapMonthly, 1)}</b></div><div class="kpi own"><span>老後の毎月の不足（持ち家）</span><b>${man(x.old.own.gapMonthly, 1)}</b></div><div class="kpi"><span>老後${x.old.years}年の家賃の合計</span><b>${man(x.old.rent.rentTotal)}</b></div></div>`,
      `<div class="kpis"><div class="kpi rent"><span>${state.retireAge}歳までに準備（賃貸のまま）</span><b>${man(x.prepare.rentNeed)}</b><span>毎月 ${man(x.prepare.monthlyRent, 1)} の積立</span></div><div class="kpi own"><span>${state.retireAge}歳までに準備（持ち家）</span><b>${man(x.prepare.ownNeed)}</b><span>毎月 ${man(x.prepare.monthlyOwn, 1)} の積立</span></div><div class="kpi"><span>差</span><b>${man(x.prepare.rentExtra)}</b><span>持たない場合に多く必要</span></div></div>`,
      `<div class="kpis"><div class="kpi own"><span>万一のとき残るローン（団信）</span><b>${man(0)}</b><span>家族に住まいが残る</span></div><div class="kpi rent"><span>賃貸なら家族が払い続ける家賃</span><b>${man(x.whatIf.danshinRentContinues, 1)}</b><span>毎月</span></div><div class="kpi"><span>金利が1%上がったら</span><b>${man(x.whatIf.rateUpPmt, 1)}</b><span>今の計画 ${man(x.whatIf.pmt, 1)}／毎月</span></div></div>`,
      `<div class="kpis"><div class="kpi"><span>${state.retireAge}歳の家の価値（横ばい）</span><b>${man(x.value65.flat)}</b><span>下落 ${man(x.value65.down)}／上昇 ${man(x.value65.up)}</span></div><div class="kpi"><span>参考：差額を積み立て運用した場合</span><b>${man(x.fair.rentInvested65)}</b><span>年${(x.fair.rate * 100).toFixed(0)}%・元本保証なし</span></div></div>`,
    ];
    $("tabs").innerHTML = steps.map((s, i) => `<button class="${i === cur && !all ? "on" : ""}" data-i="${i}">${esc(s.title.split("　")[0].split(" ")[0])}</button>`).join("");
    $("tabs").querySelectorAll("button").forEach((b) => (b.onclick = () => { cur = +b.dataset.i; all = false; render(); }));
    $("steps").innerHTML = steps.map((s, i) => `<div class="step" style="display:${all || i === cur ? "block" : "none"}">
      <h2 class="stage-title">${esc(s.title)}</h2><p class="say">${esc(s.say)}</p>${visual[i]}<p class="show">${esc(s.show)}</p><p class="ask">${esc(s.ask)}</p></div>`).join("");
    $("prev").disabled = cur === 0; $("next").disabled = cur === steps.length - 1;
    $("notes").innerHTML = S.NOTES.map((n) => `<li>${esc(n)}</li>`).join("");
  }
  $("prev").onclick = () => { cur = Math.max(0, cur - 1); all = false; render(); };
  $("next").onclick = () => { cur = Math.min(5, cur + 1); all = false; render(); };
  $("all").onclick = () => { all = !all; render(); };
  $("print").onclick = () => { all = true; render(); window.print(); };
  buildForm(); render();
})();
</script>
</body>
</html>
